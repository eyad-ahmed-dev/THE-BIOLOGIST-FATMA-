  {id:'ap-l2-x12',course:'ap',topic:'Cell Structure & Function',difficulty:'Hard',text:'Peroxisomes are chiefly responsible for:',choices:['Producing ATP through glycolysis','Breaking down fatty acids and detoxifying harmful substances','Synthesizing ribosomal RNA','Storing genetic material'],correct:1,explain:'Peroxisomes contain enzymes that oxidize fatty acids and neutralize toxins like peroxide.'},
  {id:'ap-l2-x13',course:'ap',topic:'Cell Structure & Function',difficulty:'Hard',text:'A cell\'s maximum efficient size is primarily limited by:',choices:['The number of chromosomes it contains','Its surface area-to-volume ratio','The color of its cytoplasm','The number of ribosomes present'],correct:1,explain:'As cells grow, volume increases faster than surface area, limiting exchange efficiency.'},
  {id:'ap-l2-x14',course:'ap',topic:'Cell Structure & Function',difficulty:'Easy',text:'Which transport process requires no cellular energy and moves substances down their concentration gradient?',choices:['Active transport','Passive transport (diffusion)','Endocytosis','Exocytosis'],correct:1,explain:'Passive transport relies on the concentration gradient rather than ATP.'},
  {id:'ap-l2-x15',course:'ap',topic:'Cell Structure & Function',difficulty:'Medium',text:'Endocytosis is the process by which a cell:',choices:['Releases waste into the environment','Takes in materials by engulfing them with the membrane','Divides into two daughter cells','Synthesizes new membrane proteins'],correct:1,explain:'During endocytosis, the plasma membrane folds inward to engulf external material.'},
  {id:'ap-l2-x16',course:'ap',topic:'Cell Structure & Function',difficulty:'Hard',text:'Tight junctions between adjacent animal cells primarily function to:',choices:['Allow free movement of the cells','Prevent leakage of substances between cells','Generate electrical signals','Store excess water'],correct:1,explain:'Tight junctions seal the space between cells, forming a barrier to prevent leakage.'},
  {id:'ap-l2-x17',course:'ap',topic:'Cell Structure & Function',difficulty:'Hard',text:'The endosymbiotic theory proposes that mitochondria originated from:',choices:['Folded regions of the plasma membrane','Engulfed free-living prokaryotic cells','Fragments of the nucleus','Vesicles budding from the Golgi'],correct:1,explain:'Mitochondria likely descended from engulfed bacteria that formed a mutualistic relationship.'},
  {id:'ap-l2-x18',course:'ap',topic:'Cell Structure & Function',difficulty:'Medium',text:'Which structure separates the nucleus\'s contents from the cytoplasm while allowing selective exchange?',choices:['Cell wall','Nuclear envelope','Golgi membrane','Cytoskeleton'],correct:1,explain:'The nuclear envelope, with its pores, regulates traffic between nucleus and cytoplasm.'},
  {id:'ap-l3-x01',course:'ap',topic:'Cellular Energetics',difficulty:'Easy',text:'Glycolysis, the first stage of cellular respiration, occurs in which part of the cell?',choices:['Mitochondrial matrix','Cytoplasm (cytosol)','Nucleus','Inner mitochondrial membrane'],correct:1,explain:'Glycolysis splits glucose into pyruvate in the cytosol, outside the mitochondria.'},
  {id:'ap-l3-x02',course:'ap',topic:'Cellular Energetics',difficulty:'Easy',text:'The Krebs cycle takes place in which location?',choices:['Cytoplasm','Thylakoid membrane','Mitochondrial matrix','Golgi apparatus'],correct:2,explain:'The Krebs cycle occurs in the fluid-filled matrix of the mitochondria.'},
  {id:'ap-l3-x03',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'Which molecule acts as the final electron acceptor in the aerobic electron transport chain?',choices:['Carbon dioxide','Oxygen','Glucose','Water'],correct:1,explain:'Oxygen accepts electrons at the end of the ETC, forming water.'},
  {id:'ap-l3-x04',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'Fermentation occurs in cells mainly when:',choices:['Glucose is in short supply','Oxygen is unavailable to regenerate NAD+','ATP levels are too high','Sunlight is unavailable'],correct:1,explain:'Without oxygen, cells ferment to regenerate NAD+ needed for glycolysis to continue.'},
  {id:'ap-l3-x05',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'Chlorophyll in plants primarily absorbs which wavelengths of light?',choices:['Green light','Red and blue light','Only ultraviolet light','Only infrared light'],correct:1,explain:'Chlorophyll absorbs red and blue light strongly, reflecting green light.'},
  {id:'ap-l3-x06',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'The Calvin cycle uses ATP and NADPH to:',choices:['Split water molecules','Fix carbon dioxide into glucose (G3P)','Generate oxygen gas','Transport electrons across the thylakoid'],correct:1,explain:'The Calvin cycle uses energy from the light reactions to build sugar from CO2.'},
  {id:'ap-l3-x07',course:'ap',topic:'Cellular Energetics',difficulty:'Easy',text:'Chlorophyll gives plants their green color because it:',choices:['Absorbs green light','Reflects green light','Produces green pigment as waste','Converts green light to red light'],correct:1,explain:'Green light is largely reflected rather than absorbed, which is why leaves appear green.'},
  {id:'ap-l3-x08',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'Substrate-level phosphorylation directly produces ATP during which processes?',choices:['Only the electron transport chain','Glycolysis and the Krebs cycle','Only the Calvin cycle','Only fermentation'],correct:1,explain:'Both glycolysis and the Krebs cycle generate a small amount of ATP directly.'},
  {id:'ap-l3-x09',course:'ap',topic:'Cellular Energetics',difficulty:'Easy',text:'The light-dependent reactions of photosynthesis take place on the:',choices:['Stroma','Thylakoid membrane','Outer mitochondrial membrane','Cell wall'],correct:1,explain:'Thylakoid membranes house the pigments and proteins that capture light energy.'},
  {id:'ap-l3-x10',course:'ap',topic:'Cellular Energetics',difficulty:'Hard',text:'Chemiosmosis generates ATP by using:',choices:['Direct transfer of phosphate groups','A proton gradient across a membrane, driving ATP synthase','Heat energy released from glucose','Oxygen diffusion across the membrane'],correct:1,explain:'Protons flow down their gradient through ATP synthase, powering ATP production.'},
  {id:'ap-l3-x11',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'Anaerobic respiration in human muscle cells produces which byproduct?',choices:['Ethanol','Lactic acid','Carbon dioxide only','Oxygen'],correct:1,explain:'Human muscle cells perform lactic acid fermentation when oxygen is limited.'},
  {id:'ap-l3-x12',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'How many net ATP molecules are produced directly from one glucose molecule during glycolysis?',choices:['0','2','4','36'],correct:1,explain:'Glycolysis produces 4 ATP but uses 2, for a net gain of 2 ATP.'},
  {id:'ap-l3-x13',course:'ap',topic:'Cellular Energetics',difficulty:'Hard',text:'Photosystem II is primarily responsible for:',choices:['Fixing carbon dioxide','Splitting water molecules and releasing oxygen','Producing glucose','Transporting glucose out of the cell'],correct:1,explain:'Photosystem II splits water, releasing electrons, protons, and oxygen gas.'},
  {id:'ap-l3-x14',course:'ap',topic:'Cellular Energetics',difficulty:'Easy',text:'Which gas is released as a byproduct of the light reactions of photosynthesis?',choices:['Carbon dioxide','Nitrogen','Oxygen','Methane'],correct:2,explain:'Splitting water during the light reactions releases oxygen gas.'},
  {id:'ap-l3-x15',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'Cellular respiration can be best summarized as a process that converts:',choices:['Sunlight into glucose','Glucose and oxygen into ATP, carbon dioxide, and water','Water and carbon dioxide into glucose','ATP into glucose'],correct:1,explain:'Respiration breaks down glucose in the presence of oxygen to release usable energy as ATP.'},
  {id:'ap-l3-x16',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'NADH and FADH2 primarily function to:',choices:['Store genetic information','Carry electrons to the electron transport chain','Split water during photosynthesis','Build the cell wall'],correct:1,explain:'These electron carriers deliver high-energy electrons to the ETC to drive ATP synthesis.'},
  {id:'ap-l3-x17',course:'ap',topic:'Cellular Energetics',difficulty:'Hard',text:'The overall equation of photosynthesis converts carbon dioxide and water, using light energy, into:',choices:['ATP and NADPH only','Glucose and oxygen','Pyruvate and carbon dioxide','Lactic acid and water'],correct:1,explain:'Photosynthesis stores light energy as chemical energy in glucose, releasing oxygen.'},
  {id:'ap-l3-x18',course:'ap',topic:'Cellular Energetics',difficulty:'Easy',text:'Which organelle would be most abundant in a highly active muscle cell?',choices:['Chloroplast','Mitochondria','Lysosome','Golgi apparatus'],correct:1,explain:'Muscle cells need large amounts of ATP, supplied by numerous mitochondria.'},
  {id:'ap-l4-x01',course:'ap',topic:'Heredity',difficulty:'Medium',text:'A test cross is used to determine:',choices:['The exact age of an organism','The unknown genotype of an organism showing the dominant phenotype','The number of chromosomes in a cell','Whether a mutation occurred'],correct:1,explain:'Crossing with a homozygous recessive individual reveals whether the unknown parent is heterozygous or homozygous dominant.'},
  {id:'ap-l4-x02',course:'ap',topic:'Heredity',difficulty:'Medium',text:'Incomplete dominance results in offspring with:',choices:['The exact phenotype of one parent','A blended, intermediate phenotype','Two distinct phenotypes shown simultaneously','No phenotype at all'],correct:1,explain:'Neither allele is fully dominant, producing a mix, like red and white flowers making pink.'},
  {id:'ap-l4-x03',course:'ap',topic:'Heredity',difficulty:'Medium',text:'Codominance is best illustrated by a trait where:',choices:['One allele completely masks the other','Both alleles are fully and separately expressed (e.g., AB blood type)','Alleles blend into an intermediate form','Only recessive alleles are expressed'],correct:1,explain:'In codominance, both alleles show their own distinct effect at the same time.'},
  {id:'ap-l4-x04',course:'ap',topic:'Heredity',difficulty:'Easy',text:'In humans, most sex-linked traits are carried on which chromosome?',choices:['The Y chromosome','The X chromosome','Chromosome 21','Chromosome 1'],correct:1,explain:'The X chromosome carries many more genes than the Y, so most sex-linked traits are X-linked.'},
  {id:'ap-l4-x05',course:'ap',topic:'Heredity',difficulty:'Easy',text:'A pedigree chart is used to:',choices:['Sequence an organism\'s entire genome','Trace the inheritance of a trait through generations of a family','Count the number of chromosomes in a cell','Measure the rate of mutation'],correct:1,explain:'Pedigrees track how traits pass from parents to offspring across generations.'},
  {id:'ap-l4-x06',course:'ap',topic:'Heredity',difficulty:'Medium',text:'Polygenic traits, such as human height, are influenced by:',choices:['A single gene with two alleles','Multiple genes acting together','Only environmental factors','Random chance alone'],correct:1,explain:'Polygenic inheritance involves several genes each contributing a small effect.'},
  {id:'ap-l4-x07',course:'ap',topic:'Heredity',difficulty:'Hard',text:'Nondisjunction during meiosis can result in:',choices:['Perfectly normal gametes','Gametes with an abnormal number of chromosomes','Increased protein synthesis','Faster cell division'],correct:1,explain:'When chromosomes fail to separate properly, gametes end up with too many or too few.'},
  {id:'ap-l4-x08',course:'ap',topic:'Heredity',difficulty:'Easy',text:'An organism with two different alleles for a given gene is described as:',choices:['Homozygous dominant','Homozygous recessive','Heterozygous','Haploid'],correct:2,explain:'Heterozygous individuals carry one dominant and one recessive allele for a gene.'},
  {id:'ap-l4-x09',course:'ap',topic:'Heredity',difficulty:'Medium',text:'The law of independent assortment applies to genes that are:',choices:['Located on the same chromosome, close together','Located on different chromosomes','Only found in recessive form','Only expressed in males'],correct:1,explain:'Genes on separate chromosomes assort into gametes independently of one another.'},
  {id:'ap-l4-x10',course:'ap',topic:'Heredity',difficulty:'Medium',text:'A carrier of a recessive genetic disorder typically:',choices:['Shows mild symptoms of the disorder','Shows no symptoms but can pass the allele to offspring','Cannot have children','Always passes the disorder to all offspring'],correct:1,explain:'Carriers are heterozygous, so the recessive allele\'s effect is masked by the dominant one.'},
  {id:'ap-l4-x11',course:'ap',topic:'Heredity',difficulty:'Medium',text:'Linked genes are inherited together most often because they are:',choices:['On different chromosomes','Located close together on the same chromosome','Both recessive','Both dominant'],correct:1,explain:'Genes near each other on a chromosome are less likely to be separated by crossing over.'},
  {id:'ap-l4-x12',course:'ap',topic:'Heredity',difficulty:'Hard',text:'Crossing over during meiosis I results in:',choices:['Identical daughter cells','Genetic recombination between homologous chromosomes','Doubling of chromosome number','Loss of genetic material entirely'],correct:1,explain:'Crossing over exchanges segments between homologous chromosomes, increasing variation.'},
  {id:'ap-l4-x13',course:'ap',topic:'Heredity',difficulty:'Hard',text:'In humans, an individual with the genotype XXY typically has which condition?',choices:['Down syndrome','Klinefelter syndrome','Turner syndrome','Cystic fibrosis'],correct:1,explain:'An extra X chromosome in a male (XXY) results in Klinefelter syndrome.'},
  {id:'ap-l4-x14',course:'ap',topic:'Heredity',difficulty:'Easy',text:'A dihybrid cross tracks the inheritance of:',choices:['One trait only','Two different traits at once','Three or more traits','No traits, only chromosome number'],correct:1,explain:'Dihybrid crosses examine how two genes for two traits are inherited together.'},
  {id:'ap-l4-x15',course:'ap',topic:'Heredity',difficulty:'Easy',text:'Which of the following best describes a mutation?',choices:['A predictable change passed only to sons','A change in the DNA sequence','The blending of two dominant alleles','The physical crossing of chromosomes'],correct:1,explain:'Mutations are alterations in an organism\'s DNA sequence.'},
  {id:'ap-l4-x16',course:'ap',topic:'Heredity',difficulty:'Hard',text:'Epistasis occurs when:',choices:['Two genes are located on the same chromosome','One gene masks or influences the expression of another gene','A trait skips a generation randomly','Meiosis produces four identical cells'],correct:1,explain:'In epistasis, the expression of one gene depends on the alleles present at another gene.'},
  {id:'ap-l4-x17',course:'ap',topic:'Heredity',difficulty:'Medium',text:'Autosomal recessive disorders require an individual to have:',choices:['One copy of the recessive allele','Two copies of the recessive allele','A mutation on the Y chromosome','No functional alleles at all'],correct:1,explain:'Both alleles must be recessive for the disorder to be expressed, since one dominant allele masks it.'},
  {id:'ap-l4-x18',course:'ap',topic:'Heredity',difficulty:'Medium',text:'In a cross between two heterozygous parents (Aa x Aa), the probability of a homozygous dominant offspring is:',choices:['1/2','1/4','3/4','0'],correct:1,explain:'The genotype ratio is 1 AA : 2 Aa : 1 aa, so 1/4 are homozygous dominant.'},
  {id:'est2-l1-x01',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Which structure controls the movement of materials into and out of a cell?',choices:['Nucleus','Plasma membrane','Ribosome','Cytoplasm'],correct:1,explain:'The plasma membrane regulates what enters and exits through selective permeability.'},
  {id:'est2-l1-x02',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Ribosomes in a cell are mainly responsible for:',choices:['Protein synthesis','Photosynthesis','Waste digestion','Water storage'],correct:0,explain:'Ribosomes read mRNA instructions to assemble amino acids into proteins.'},
  {id:'est2-l1-x03',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'The nucleus of a cell contains which important structures?',choices:['Chloroplasts','Chromosomes (DNA)','Ribosomes only','Cell wall material'],correct:1,explain:'The nucleus houses the cell\'s genetic material, organized into chromosomes.'},
  {id:'est2-l1-x04',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Which organelle breaks down waste materials within a cell?',choices:['Lysosome','Golgi apparatus','Mitochondria','Vacuole'],correct:0,explain:'Lysosomes contain enzymes that digest waste and worn-out cell parts.'},
  {id:'est2-l1-x05',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Plant cells store water and maintain rigidity primarily using:',choices:['The nucleus','The central vacuole','The cell membrane','Ribosomes'],correct:1,explain:'The large central vacuole stores water and creates pressure that keeps the cell firm.'},
  {id:'est2-l1-x06',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Mitochondria are often called the powerhouse of the cell because they:',choices:['Produce ATP through respiration','Store genetic material','Digest waste products','Synthesize proteins'],correct:0,explain:'Mitochondria generate most of a cell\'s usable energy in the form of ATP.'},
  {id:'est2-l1-x07',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Which type of cell has genetic material floating freely, without a surrounding nucleus?',choices:['Eukaryotic cells','Prokaryotic cells','Plant cells only','Fungal cells only'],correct:1,explain:'Prokaryotic cells (bacteria) lack a membrane-bound nucleus.'},
  {id:'est2-l1-x08',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Chloroplasts capture light energy to carry out:',choices:['Cellular respiration','Photosynthesis','Protein digestion','DNA replication'],correct:1,explain:'Chloroplasts use light energy to produce glucose during photosynthesis.'},
  {id:'est2-l1-x09',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'The cell membrane is composed mainly of:',choices:['A single layer of protein','A phospholipid bilayer with embedded proteins','Cellulose fibers','A layer of DNA'],correct:1,explain:'The membrane\'s structure is a fluid bilayer of phospholipids studded with proteins.'},
  {id:'est2-l1-x10',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Which structure provides rigidity and protection to plant cells?',choices:['Cell wall','Nucleus','Cytoplasm','Ribosome'],correct:0,explain:'The rigid cellulose cell wall supports and protects plant cells.'},
  {id:'est2-l1-x11',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Cytoplasm refers to:',choices:['The genetic material of the cell','The jelly-like substance filling the cell and holding the organelles','The outer boundary of the cell','A type of protein'],correct:1,explain:'Cytoplasm is the fluid medium where organelles are suspended within the cell.'},
  {id:'est2-l1-x12',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Bacteria are classified as which type of organism?',choices:['Eukaryotes','Prokaryotes','Fungi','Protists'],correct:1,explain:'Bacteria lack a nucleus and membrane-bound organelles, making them prokaryotes.'},
  {id:'est2-l1-x13',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Which organelle assembles proteins based on instructions from mRNA?',choices:['Mitochondria','Ribosome','Vacuole','Cell wall'],correct:1,explain:'Ribosomes translate mRNA sequences into chains of amino acids (proteins).'},
  {id:'est2-l1-x14',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'The endoplasmic reticulum is mainly involved in:',choices:['Protein and lipid synthesis and transport','Photosynthesis','Cellular waste storage','Cell division only'],correct:0,explain:'The ER (rough and smooth) synthesizes and transports proteins and lipids within the cell.'},
  {id:'est2-l1-x15',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'Unicellular organisms perform all necessary life processes:',choices:['Using multiple specialized organs','Within a single cell','Only with the help of other organisms','Without any organelles'],correct:1,explain:'A single cell in a unicellular organism must carry out every life function alone.'},
  {id:'est2-l1-x16',course:'est2',topic:'Cell Biology',difficulty:'Hard',text:'Which structure is found in animal cells (important for cell division) but is absent in most plant cells?',choices:['Centrioles','Mitochondria','Ribosomes','Cell membrane'],correct:0,explain:'Centrioles help organize the spindle during animal cell division; most plants lack them.'},
  {id:'est2-l1-x17',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Cell theory states that:',choices:['Only plants are made of cells','All living things are made of cells, and cells arise from existing cells','Cells can form spontaneously from non-living matter','Animals have no cellular structure'],correct:1,explain:'Cell theory establishes cells as life\'s basic unit, always arising from prior cells.'},
  {id:'est2-l1-x18',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Osmosis is a special type of diffusion involving the movement of:',choices:['Proteins across a membrane','Water across a selectively permeable membrane','Oxygen out of the cell','Glucose into the cell only'],correct:1,explain:'Osmosis specifically describes water movement across a semi-permeable membrane.'},
  {id:'est2-l2-x01',course:'est2',topic:'Genetics',difficulty:'Easy',text:'A Punnett square is a tool used to:',choices:['Measure chromosome length','Predict the probability of offspring genotypes','Identify mutations directly','Count the number of genes in an organism'],correct:1,explain:'Punnett squares organize possible allele combinations to predict offspring outcomes.'},
  {id:'est2-l2-x02',course:'est2',topic:'Genetics',difficulty:'Medium',text:'In pea plants, tall (T) is dominant over short (t). A Tt x Tt cross yields what phenotype ratio?',choices:['1 tall : 3 short','3 tall : 1 short','1 tall : 1 short','All tall'],correct:1,explain:'The genotype ratio 1TT:2Tt:1tt produces a 3:1 phenotypic ratio favoring the dominant trait.'},
  {id:'est2-l2-x03',course:'est2',topic:'Genetics',difficulty:'Easy',text:'A recessive trait is only expressed in an individual when:',choices:['They have one dominant allele','They have two recessive alleles','They have any two alleles','They are male'],correct:1,explain:'Recessive traits require two copies of the recessive allele to appear, since one dominant allele would mask it.'},
  {id:'est2-l2-x04',course:'est2',topic:'Genetics',difficulty:'Medium',text:'DNA replication must occur before:',choices:['Protein folding','Cell division','Osmosis','Enzyme activity'],correct:1,explain:'Cells must copy their DNA before dividing so each daughter cell gets a full genome.'},
  {id:'est2-l2-x05',course:'est2',topic:'Genetics',difficulty:'Medium',text:'A karyotype shows:',choices:['An organism\'s diet','An organism\'s complete set of chromosomes','The sequence of a single gene','The pH of a cell'],correct:1,explain:'Karyotypes display all chromosomes, arranged by size and shape, useful for spotting abnormalities.'},
  {id:'est2-l2-x06',course:'est2',topic:'Genetics',difficulty:'Easy',text:'How many chromosomes are found in a typical human somatic (body) cell?',choices:['23','46','44','92'],correct:1,explain:'Humans have 46 chromosomes in body cells: 23 from each parent.'},
  {id:'est2-l2-x07',course:'est2',topic:'Genetics',difficulty:'Medium',text:'Genetic mutations can be caused by:',choices:['Errors in DNA replication or environmental factors','Only inherited traits','The process of meiosis alone','Osmosis'],correct:0,explain:'Mutations arise from replication mistakes or exposure to mutagens like radiation or chemicals.'},
  {id:'est2-l2-x08',course:'est2',topic:'Genetics',difficulty:'Easy',text:'Which structure carries hereditary information from parent to offspring?',choices:['Ribosomes','Chromosomes (DNA)','Mitochondria','Cell wall'],correct:1,explain:'Chromosomes, made of DNA, transmit genetic instructions between generations.'},
  {id:'est2-l2-x09',course:'est2',topic:'Genetics',difficulty:'Medium',text:'Sex cells (gametes) are produced through which process?',choices:['Mitosis','Meiosis','Fermentation','Photosynthesis'],correct:1,explain:'Meiosis reduces chromosome number by half, producing haploid gametes.'},
  {id:'est2-l2-x10',course:'est2',topic:'Genetics',difficulty:'Medium',text:'A trait controlled by a single gene with two alleles is called a:',choices:['Polygenic trait','Monogenic (Mendelian) trait','Sex-linked trait only','Vestigial trait'],correct:1,explain:'Monogenic traits follow simple Mendelian inheritance patterns.'},
  {id:'est2-l2-x11',course:'est2',topic:'Genetics',difficulty:'Hard',text:'If both parents are carriers (Aa) for a recessive disorder, the chance a child is affected (aa) is:',choices:['0%','25%','50%','100%'],correct:1,explain:'An Aa x Aa cross produces a 1/4 (25%) chance of an aa (affected) offspring.'},
  {id:'est2-l2-x12',course:'est2',topic:'Genetics',difficulty:'Medium',text:'Which molecule directly carries the genetic code from DNA to the ribosome?',choices:['Messenger RNA (mRNA)','Transfer RNA (tRNA)','DNA polymerase','Glucose'],correct:0,explain:'mRNA is transcribed from DNA and carries the code to ribosomes for translation.'},
  {id:'est2-l2-x13',course:'est2',topic:'Genetics',difficulty:'Medium',text:'A change in a single DNA base pair is called:',choices:['A karyotype','A point mutation','A chromosome','A gamete'],correct:1,explain:'Point mutations alter just one nucleotide in the DNA sequence.'},
  {id:'est2-l2-x14',course:'est2',topic:'Genetics',difficulty:'Easy',text:'Twins that develop from a single fertilized egg splitting into two are called:',choices:['Fraternal twins','Identical (monozygotic) twins','Conjoined organisms','Hybrid twins'],correct:1,explain:'Identical twins share the same genetic material since they came from one zygote.'},
  {id:'est2-l2-x15',course:'est2',topic:'Genetics',difficulty:'Medium',text:'Selective breeding relies on humans choosing organisms with:',choices:['Random traits','Desirable heritable traits to reproduce','No observable traits','Only recessive traits'],correct:1,explain:'Breeders select individuals with favorable traits to pass on to future generations.'},
  {id:'est2-l2-x16',course:'est2',topic:'Genetics',difficulty:'Medium',text:'Genotype refers to an organism\'s genetic makeup, while phenotype refers to:',choices:['Its geographic location','Its observable physical characteristics','Its number of offspring','Its chromosome count only'],correct:1,explain:'Phenotype is the physical expression that results from genotype and environment.'},
  {id:'est2-l2-x17',course:'est2',topic:'Genetics',difficulty:'Hard',text:'Down syndrome is most commonly caused by:',choices:['A missing X chromosome','An extra copy of chromosome 21','A mutation in a single gene','Exposure to sunlight'],correct:1,explain:'Trisomy 21 (an extra chromosome 21) causes Down syndrome.'},
  {id:'est2-l2-x18',course:'est2',topic:'Genetics',difficulty:'Medium',text:'A cross between a homozygous dominant (AA) and homozygous recessive (aa) individual produces offspring that are:',choices:['All AA','All aa','All Aa','1/2 AA, 1/2 aa'],correct:2,explain:'Every offspring inherits one A and one a allele, making them all heterozygous (Aa).'},
  {id:'est2-l3-x01',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'The digestive system\'s main function is to:',choices:['Pump blood throughout the body','Break down food into absorbable nutrients','Produce hormones only','Filter air for breathing'],correct:1,explain:'Digestion mechanically and chemically breaks food down so nutrients can be absorbed.'},
  {id:'est2-l3-x02',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Which organ pumps blood throughout the circulatory system?',choices:['The liver','The heart','The kidney','The stomach'],correct:1,explain:'The heart\'s rhythmic contractions push blood through the entire circulatory system.'},
  {id:'est2-l3-x03',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'Neurons transmit signals throughout the body using:',choices:['Only hormones','Electrical impulses and chemical neurotransmitters','Only muscle contractions','Sound waves'],correct:1,explain:'Neurons use electrical signals along their length and chemical signals at synapses.'},
  {id:'est2-l3-x04',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'The kidneys\' primary role in the body is to:',choices:['Produce insulin','Filter waste from the blood and produce urine','Pump blood','Digest fats'],correct:1,explain:'Kidneys filter blood, removing waste products to form urine.'},
  {id:'est2-l3-x05',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Which body system produces hormones that regulate many body processes?',choices:['The skeletal system','The endocrine system','The digestive system','The integumentary system'],correct:1,explain:'Endocrine glands release hormones into the bloodstream to regulate body functions.'},
  {id:'est2-l3-x06',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Muscles attached to bones that enable voluntary movement are called:',choices:['Cardiac muscles','Smooth muscles','Skeletal muscles','Involuntary muscles'],correct:2,explain:'Skeletal muscles attach to bones via tendons and allow deliberate, voluntary movement.'},
  {id:'est2-l3-x07',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'The skin serves the body primarily by:',choices:['Producing red blood cells','Protecting against pathogens and regulating temperature','Filtering blood','Storing genetic material'],correct:1,explain:'As the body\'s outer barrier, skin defends against infection and helps regulate heat loss.'},
  {id:'est2-l3-x08',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'Which blood vessels carry blood away from the heart?',choices:['Veins','Arteries','Capillaries only','Lymph vessels'],correct:1,explain:'Arteries carry oxygenated blood away from the heart to the body\'s tissues.'},
  {id:'est2-l3-x09',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'The immune system\'s main role is to defend the body against:',choices:['Hormonal imbalances','Pathogens such as bacteria and viruses','Muscle fatigue','Bone density loss'],correct:1,explain:'Immune cells identify and destroy harmful invaders like bacteria and viruses.'},
  {id:'est2-l3-x10',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'Which gland regulates the body\'s metabolism through hormone secretion?',choices:['The pancreas','The thyroid gland','The kidney','The liver'],correct:1,explain:'The thyroid gland releases hormones that control the body\'s metabolic rate.'},
  {id:'est2-l3-x11',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Bones provide the body with:',choices:['Only movement','Structural support and mineral storage','Digestion of nutrients','Hormone production only'],correct:1,explain:'Beyond support, bones store minerals like calcium and produce blood cells.'},
  {id:'est2-l3-x12',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'The alveoli in the lungs are the specific site of:',choices:['Blood filtration','Gas exchange (oxygen and carbon dioxide)','Hormone production','Nutrient absorption'],correct:1,explain:'Tiny air sacs called alveoli allow oxygen and carbon dioxide to diffuse into/out of the blood.'},
  {id:'est2-l3-x13',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'The liver plays a key role in the body by:',choices:['Pumping blood','Detoxifying substances and aiding metabolism','Producing sound for hearing','Regulating body temperature only'],correct:1,explain:'The liver filters toxins from the blood and helps regulate metabolism.'},
  {id:'est2-l3-x14',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Which system coordinates rapid responses using the brain and spinal cord?',choices:['The endocrine system','The nervous system','The digestive system','The skeletal system'],correct:1,explain:'The central nervous system (brain and spinal cord) processes and responds to stimuli quickly.'},
  {id:'est2-l3-x15',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'Digestive enzymes function mainly to:',choices:['Store excess nutrients','Break down large food molecules into smaller ones','Produce red blood cells','Transmit nerve impulses'],correct:1,explain:'Enzymes speed up the chemical breakdown of large food molecules for absorption.'},
  {id:'est2-l3-x16',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'The heart\'s four chambers include the left and right atria, and the left and right:',choices:['Lungs','Ventricles','Valves only','Capillaries'],correct:1,explain:'The heart has two upper chambers (atria) and two lower chambers (ventricles).'},
  {id:'est2-l3-x17',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'White blood cells primarily function to:',choices:['Carry oxygen throughout the body','Fight infection','Clot blood at wound sites','Digest food'],correct:1,explain:'White blood cells are key components of the immune system, targeting pathogens.'},
  {id:'est2-l3-x18',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Homeostasis refers to the body\'s ability to:',choices:['Grow rapidly during puberty','Maintain a stable internal environment','Produce excess waste','Increase muscle mass'],correct:1,explain:'Homeostasis is the regulation of internal conditions like temperature and pH within a stable range.'},
  {id:'est2-l4-x01',course:'est2',topic:'Ecology',difficulty:'Easy',text:'A food web illustrates:',choices:['The life cycle of a single organism','The interconnected feeding relationships in an ecosystem','The chemical structure of DNA','The stages of cell division'],correct:1,explain:'Food webs show how multiple food chains overlap and interconnect within a community.'},
  {id:'est2-l4-x02',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Which term describes an organism\'s role and interactions within its environment?',choices:['Habitat','Niche','Biome','Population'],correct:1,explain:'A niche encompasses an organism\'s role, resource use, and interactions in its ecosystem.'},
  {id:'est2-l4-x03',course:'est2',topic:'Ecology',difficulty:'Medium',text:'A symbiotic relationship in which both organisms benefit is called:',choices:['Parasitism','Commensalism','Mutualism','Predation'],correct:2,explain:'In mutualism, both species gain some advantage from their close association.'},
  {id:'est2-l4-x04',course:'est2',topic:'Ecology',difficulty:'Easy',text:'Predation describes a relationship where:',choices:['Two species compete for the same resource','One organism hunts and consumes another','Both organisms benefit equally','One organism lives harmlessly on another'],correct:1,explain:'In predation, the predator captures and consumes the prey organism.'},
  {id:'est2-l4-x05',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Carrying capacity refers to:',choices:['The total number of species in a region','The maximum population size an environment can sustainably support','The rate of population growth','The number of predators in an ecosystem'],correct:1,explain:'Carrying capacity is the population limit an environment can support long-term given its resources.'},
  {id:'est2-l4-x06',course:'est2',topic:'Ecology',difficulty:'Easy',text:'Producers convert energy into food primarily through:',choices:['Cellular respiration','Photosynthesis','Decomposition','Fermentation'],correct:1,explain:'Producers like plants use photosynthesis to capture light energy and produce food.'},
  {id:'est2-l4-x07',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Decomposers play a critical role in ecosystems by:',choices:['Producing oxygen','Breaking down dead organisms and recycling nutrients','Hunting live prey','Converting sunlight to sugar'],correct:1,explain:'Decomposers return nutrients locked in dead organic matter back into the ecosystem.'},
  {id:'est2-l4-x08',course:'est2',topic:'Ecology',difficulty:'Easy',text:'Biodiversity refers to:',choices:['The number of ecosystems on Earth','The variety of species within an ecosystem','The total mass of all organisms','The amount of sunlight an area receives'],correct:1,explain:'Biodiversity measures the variety of life forms present in a given area.'},
  {id:'est2-l4-x09',course:'est2',topic:'Ecology',difficulty:'Medium',text:'A biome is best described as:',choices:['A single organism\'s habitat','A large geographic region with a distinct climate and community of organisms','A small pond ecosystem','A single food chain'],correct:1,explain:'Biomes are broad regions, like deserts or rainforests, defined by climate and typical life.'},
  {id:'est2-l4-x10',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Competition occurs when organisms:',choices:['Cooperate to find food','Struggle for the same limited resources','Live in completely separate habitats','Reproduce asexually'],correct:1,explain:'When resources like food or space are limited, organisms compete for access to them.'},
  {id:'est2-l4-x11',course:'est2',topic:'Ecology',difficulty:'Easy',text:'The water cycle involves processes such as:',choices:['Photosynthesis and respiration','Evaporation, condensation, and precipitation','Fermentation and digestion','Mitosis and meiosis'],correct:1,explain:'Water continuously moves through the environment via evaporation, condensation, and precipitation.'},
  {id:'est2-l4-x12',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Invasive species can disrupt ecosystems by:',choices:['Improving soil quality only','Outcompeting native species for resources','Increasing biodiversity permanently','Providing food for all predators'],correct:1,explain:'Invasive species often outcompete natives, reducing biodiversity and disrupting balance.'},
  {id:'est2-l4-x13',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Parasitism describes a relationship where:',choices:['Both organisms benefit','One organism benefits while harming the other','Neither organism is affected','One organism helps without being affected'],correct:1,explain:'A parasite benefits at the expense of its host, which is harmed by the relationship.'},
  {id:'est2-l4-x14',course:'est2',topic:'Ecology',difficulty:'Hard',text:'Ecological succession refers to:',choices:['The extinction of a keystone species','The gradual change in species composition of an ecosystem over time','The migration of a single species','The daily cycle of predator-prey interactions'],correct:1,explain:'Succession describes how communities change and develop over time, like after a disturbance.'},
  {id:'est2-l4-x15',course:'est2',topic:'Ecology',difficulty:'Hard',text:'A keystone species is one that:',choices:['Is the largest organism in an ecosystem','Has a disproportionately large effect on its ecosystem relative to its abundance','Only exists in captivity','Cannot interact with other species'],correct:1,explain:'Removing a keystone species can cause dramatic changes throughout the ecosystem.'},
  {id:'est2-l4-x16',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Nitrogen fixation is ecologically important because it:',choices:['Removes all nitrogen from the atmosphere','Converts nitrogen gas into a form usable by organisms','Produces oxygen for respiration','Breaks down dead organic matter'],correct:1,explain:'Certain bacteria convert inert nitrogen gas into compounds plants can absorb and use.'},
  {id:'est2-l4-x17',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Which factor most directly limits population growth when resources become scarce?',choices:['Genetic drift','Limiting factors such as food and space','Mutation rate','Photosynthesis rate'],correct:1,explain:'Limiting factors like food, water, and space restrict how large a population can grow.'},
  {id:'est2-l4-x18',course:'est2',topic:'Ecology',difficulty:'Hard',text:'Bioaccumulation refers to:',choices:['The rapid decomposition of toxins','The buildup of substances like toxins in an organism over time','The migration of species between biomes','The growth rate of a population'],correct:1,explain:'Bioaccumulation describes toxins building up in an organism\'s tissues faster than they\'re removed.'},
  {id:'act2-l1-x01',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'Which organelle is the primary site of aerobic ATP production?',choices:['Nucleus','Mitochondria','Ribosome','Golgi apparatus'],correct:1,explain:'Mitochondria carry out aerobic respiration, generating most of a cell\'s ATP.'},
  {id:'act2-l1-x02',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'The plasma membrane\'s selective permeability results mainly from its:',choices:['Rigid cellulose structure','Phospholipid bilayer structure with embedded proteins','Layer of DNA','Solid protein wall'],correct:1,explain:'The bilayer and its embedded proteins control which substances can pass through.'},
  {id:'act2-l1-x03',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'Diffusion moves particles:',choices:['From low to high concentration','From high to low concentration','Only through active transport','Only across the nuclear membrane'],correct:1,explain:'Particles naturally spread from areas of higher to lower concentration.'},
  {id:'act2-l1-x04',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Active transport requires cellular energy because it moves substances:',choices:['Down their concentration gradient','Against their concentration gradient','Only within the nucleus','Through simple diffusion'],correct:1,explain:'Moving substances against a gradient requires ATP to power transport proteins.'},
  {id:'act2-l1-x05',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'Ribosomes, responsible for protein synthesis, can be found:',choices:['Only inside the nucleus','Free in the cytoplasm or attached to the rough ER','Only in the mitochondria','Only in chloroplasts'],correct:1,explain:'Ribosomes are found floating freely or bound to the rough endoplasmic reticulum.'},
  {id:'act2-l1-x06',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'Which organelle contains the cell\'s genetic material in eukaryotic cells?',choices:['Mitochondria','Nucleus','Ribosome','Vacuole'],correct:1,explain:'The nucleus houses and protects the cell\'s DNA.'},
  {id:'act2-l1-x07',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Placing a cell in a hypertonic solution causes it to:',choices:['Swell and possibly burst','Lose water and shrink','Stay exactly the same size','Divide rapidly'],correct:1,explain:'In a hypertonic solution, water leaves the cell by osmosis, causing it to shrink.'},
  {id:'act2-l1-x08',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'The cytoskeleton is composed of protein fibers that provide:',choices:['Genetic instructions','Structural support and enable cell movement','Energy storage','Waste removal'],correct:1,explain:'Microfilaments and microtubules give cells shape and allow internal transport and movement.'},
  {id:'act2-l1-x09',course:'act2',topic:'Cell Biology',difficulty:'Hard',text:'Facilitated diffusion differs from simple diffusion because it:',choices:['Requires ATP','Uses membrane transport proteins to move substances down their gradient','Moves substances against their gradient','Only occurs in plant cells'],correct:1,explain:'Facilitated diffusion still moves down the gradient but needs a channel or carrier protein.'},
  {id:'act2-l1-x10',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'Which cell part is responsible for capturing light energy during photosynthesis?',choices:['Mitochondria','Chloroplast','Lysosome','Nucleus'],correct:1,explain:'Chloroplasts contain chlorophyll, which absorbs light energy for photosynthesis.'},
  {id:'act2-l1-x11',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Vesicles that transport proteins typically bud off from which organelle?',choices:['The nucleus','The Golgi apparatus','The cell wall','The cytoskeleton'],correct:1,explain:'The Golgi apparatus packages and ships proteins in vesicles to their destinations.'},
  {id:'act2-l1-x12',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Placing a cell in an isotonic solution causes it to:',choices:['Shrink significantly','Swell and burst','Maintain a stable size, with no net water movement','Immediately die'],correct:2,explain:'In an isotonic solution, water moves equally in both directions, so cell size stays stable.'},
  {id:'act2-l1-x13',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Which structure regulates which materials pass in and out of the nucleus?',choices:['The cell wall','The nuclear envelope and its pores','The mitochondria','The Golgi apparatus'],correct:1,explain:'Nuclear pores in the envelope control the exchange of molecules with the cytoplasm.'},
  {id:'act2-l1-x14',course:'act2',topic:'Cell Biology',difficulty:'Hard',text:'Endocytosis and exocytosis both fundamentally involve:',choices:['Simple diffusion','Vesicle-mediated transport across the membrane','Osmosis only','Passive transport without energy'],correct:1,explain:'Both processes use membrane-bound vesicles to move materials into or out of the cell.'},
  {id:'act2-l1-x15',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'Prokaryotic cells lack which structures found in eukaryotic cells?',choices:['A cell membrane','Membrane-bound organelles','Ribosomes','DNA'],correct:1,explain:'Prokaryotes have no nucleus or other membrane-enclosed organelles.'},
  {id:'act2-l1-x16',course:'act2',topic:'Cell Biology',difficulty:'Hard',text:'A cell\'s surface area to volume ratio most directly affects:',choices:['Its rate of mitosis','How efficiently it exchanges materials with its environment','Its genetic code','Its color'],correct:1,explain:'A higher ratio allows more efficient exchange of nutrients and waste across the membrane.'},
  {id:'act2-l1-x17',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Which two types of macromolecules make up the majority of a cell membrane?',choices:['Carbohydrates and nucleic acids','Phospholipids and proteins','DNA and RNA','Starch and cellulose'],correct:1,explain:'The membrane is a phospholipid bilayer with embedded and surface proteins.'},
  {id:'act2-l1-x18',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Turgor pressure in plant cells results from:',choices:['Air trapped in the cytoplasm','Water pressure pushing against the cell wall','Excess protein buildup','Loss of the cell membrane'],correct:1,explain:'Water entering the vacuole pushes outward against the rigid cell wall, creating turgor pressure.'},
  {id:'act2-l2-x01',course:'act2',topic:'Genetics & Heredity',difficulty:'Easy',text:'Alleles are best described as:',choices:['Identical copies of a chromosome','Different versions of the same gene','Cell organelles','Types of proteins'],correct:1,explain:'Alleles are alternative forms of a gene that can produce different traits.'},
  {id:'act2-l2-x02',course:'act2',topic:'Genetics & Heredity',difficulty:'Easy',text:'A homozygous recessive individual has a genotype written as:',choices:['AA','Aa','aa','Aaa'],correct:2,explain:'Homozygous recessive means both alleles are the lowercase (recessive) form.'},
  {id:'act2-l2-x03',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'Which process ensures genetic variation among offspring during sexual reproduction?',choices:['Mitosis','Meiosis, through crossing over and independent assortment','Binary fission','Photosynthesis'],correct:1,explain:'Meiosis shuffles genetic material, producing gametes with unique allele combinations.'},
  {id:'act2-l2-x04',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'A test cross combines an individual of unknown genotype with:',choices:['Another unknown individual','A homozygous recessive individual','A homozygous dominant individual','An identical twin'],correct:1,explain:'Crossing with a homozygous recessive parent reveals the unknown genotype through the offspring ratios.'},
  {id:'act2-l2-x05',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'In a monohybrid cross of Bb x Bb, the expected genotype ratio is:',choices:['1:1','1:2:1','3:1','9:3:3:1'],correct:1,explain:'The cross produces 1 BB : 2 Bb : 1 bb, a 1:2:1 genotype ratio.'},
  {id:'act2-l2-x06',course:'act2',topic:'Genetics & Heredity',difficulty:'Easy',text:'In humans, the sex chromosomes are labeled:',choices:['A and B','X and Y','M and F','1 and 2'],correct:1,explain:'Humans have two sex chromosomes: X and Y, determining biological sex.'},
  {id:'act2-l2-x07',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'A trait carried specifically on the X chromosome is described as:',choices:['Autosomal','X-linked','Y-linked','Polygenic'],correct:1,explain:'X-linked traits follow inheritance patterns tied to the X chromosome, differing by sex.'},
  {id:'act2-l2-x08',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'Genetic variation within a population is important because it:',choices:['Guarantees survival of every individual','Increases a species\' ability to adapt to changing environments','Prevents mutations from occurring','Eliminates the need for reproduction'],correct:1,explain:'Variation gives populations the raw material needed for natural selection and adaptation.'},
  {id:'act2-l2-x09',course:'act2',topic:'Genetics & Heredity',difficulty:'Easy',text:'Which of the following best defines a gene?',choices:['An entire chromosome','A segment of DNA that codes for a specific trait','A type of protein','A cell organelle'],correct:1,explain:'A gene is a specific DNA sequence that provides instructions for a trait.'},
  {id:'act2-l2-x10',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'Mendel\'s law of segregation states that:',choices:['Genes on different chromosomes assort independently','Allele pairs separate during gamete formation','All traits are always dominant','Chromosomes never separate during meiosis'],correct:1,explain:'Each parent\'s two alleles for a gene separate, so each gamete gets only one.'},
  {id:'act2-l2-x11',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'A Punnett square crossing two heterozygous parents for one trait predicts what percent of offspring will be recessive?',choices:['0%','25%','50%','75%'],correct:1,explain:'An Aa x Aa cross yields a 1:2:1 ratio, meaning 25% are homozygous recessive.'},
  {id:'act2-l2-x12',course:'act2',topic:'Genetics & Heredity',difficulty:'Hard',text:'Nondisjunction, an error in chromosome separation, can result in conditions such as:',choices:['Down syndrome (trisomy 21)','Improved genetic variation','Faster cell division','Immediate cell death'],correct:0,explain:'Nondisjunction can lead to an abnormal chromosome number, as in Down syndrome.'},
  {id:'act2-l2-x13',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'A pedigree showing an affected child born to two unaffected parents suggests the trait is:',choices:['Dominant','Recessive','Sex-linked dominant','Impossible to inherit'],correct:1,explain:'If unaffected parents (both carriers) have an affected child, the trait must be recessive.'},
  {id:'act2-l2-x14',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'Codominant alleles result in offspring that:',choices:['Show a blended intermediate trait','Express both traits simultaneously and distinctly','Show only the dominant trait','Show no observable trait'],correct:1,explain:'In codominance, both alleles are fully and separately visible in the phenotype.'},
  {id:'act2-l2-x15',course:'act2',topic:'Genetics & Heredity',difficulty:'Easy',text:'Which statement best describes a mutation\'s potential effect on an organism?',choices:['It is always harmful','It is always beneficial','It may be harmful, neutral, or beneficial','It always causes immediate death'],correct:2,explain:'Mutations can have a range of effects depending on where and how they occur.'},
  {id:'act2-l2-x16',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'Genetic engineering involves:',choices:['Selective breeding over many generations','Directly manipulating an organism\'s DNA','Only observing inherited traits','Studying fossils for genetic clues'],correct:1,explain:'Genetic engineering directly alters an organism\'s genetic material in the lab.'},
  {id:'act2-l2-x17',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'A cross between AABB and aabb parents would produce F1 offspring with which genotype?',choices:['AABB','aabb','AaBb','AAbb'],correct:2,explain:'Each parent contributes one allele per gene, so all offspring are heterozygous (AaBb) for both traits.'},
  {id:'act2-l2-x18',course:'act2',topic:'Genetics & Heredity',difficulty:'Hard',text:'Chromosomes are made of DNA tightly wound around proteins called:',choices:['Ribosomes','Histones','Enzymes','Hormones'],correct:1,explain:'Histone proteins help package and organize DNA into compact chromosome structures.'},
  {id:'act2-l3-x01',course:'act2',topic:'Evolution',difficulty:'Easy',text:'Charles Darwin proposed that evolution occurs primarily through the mechanism of:',choices:['Genetic engineering','Natural selection','Selective breeding only','Spontaneous generation'],correct:1,explain:'Darwin\'s theory centers on natural selection acting on heritable variation.'},
  {id:'act2-l3-x02',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Which of the following is considered strong evidence supporting evolution?',choices:['Horoscope predictions','The fossil record, comparative anatomy, and DNA similarities','Weather patterns','Population census data alone'],correct:1,explain:'Multiple independent lines of evidence, including fossils and DNA, support evolutionary theory.'},
  {id:'act2-l3-x03',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Convergent evolution results in organisms that:',choices:['Share a recent common ancestor','Evolve similar traits independently due to similar environments','Are always closely related species','Cannot reproduce with any other species'],correct:1,explain:'Unrelated species can evolve similar features when facing similar environmental pressures.'},
  {id:'act2-l3-x04',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Artificial selection differs from natural selection because:',choices:['It never changes a population\'s traits','Humans, not nature, choose which traits are favored','It only occurs in plants','It cannot produce new breeds or varieties'],correct:1,explain:'In artificial selection, human preference (not environmental pressure) determines which traits persist.'},
  {id:'act2-l3-x05',course:'act2',topic:'Evolution',difficulty:'Easy',text:'A population\'s gene pool refers to:',choices:['The physical location where a population lives','All the alleles present within that population','A single individual\'s complete genome','The rate of reproduction in a population'],correct:1,explain:'The gene pool is the total collection of genes and their variants in a population.'},
  {id:'act2-l3-x06',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Genetic drift has the strongest effect on which type of population?',choices:['Very large populations','Small populations','Populations with no reproduction','Populations of a single species only'],correct:1,explain:'Random chance events have a much bigger impact on allele frequencies in small populations.'},
  {id:'act2-l3-x07',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Speciation occurs when:',choices:['Two populations interbreed freely','Populations become reproductively isolated and diverge into separate species','A single organism mutates once','Populations stay perfectly identical over time'],correct:1,explain:'Reproductive isolation allows populations to accumulate differences until they become distinct species.'},
  {id:'act2-l3-x08',course:'act2',topic:'Evolution',difficulty:'Easy',text:'Which structure is generally considered vestigial in humans?',choices:['The heart','The appendix','The brain','The lungs'],correct:1,explain:'The appendix is thought to be a reduced remnant of a structure with greater function in ancestors.'},
  {id:'act2-l3-x09',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Stabilizing selection favors:',choices:['Both extreme phenotypes','The average phenotype, reducing variation','Only the largest individuals','Random phenotypes with no pattern'],correct:1,explain:'Stabilizing selection narrows variation by favoring individuals near the population average.'},
  {id:'act2-l3-x10',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Disruptive selection favors:',choices:['Only the average phenotype','Both extreme phenotypes over the average','A single random phenotype','No phenotype in particular'],correct:1,explain:'Disruptive selection increases variation by favoring both extremes and disfavoring the middle.'},
  {id:'act2-l3-x11',course:'act2',topic:'Evolution',difficulty:'Hard',text:'The bottleneck effect occurs when:',choices:['A population\'s size is drastically reduced, lowering genetic diversity','A population grows exponentially','Two species merge into one','Mutation rates decrease to zero'],correct:0,explain:'A sudden population crash leaves a smaller, less genetically diverse group of survivors.'},
  {id:'act2-l3-x12',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Adaptive radiation refers to:',choices:['The extinction of a single species','The rapid diversification of a species into many new forms','A population staying genetically identical','The migration of species to new continents'],correct:1,explain:'Adaptive radiation happens when a species rapidly diversifies to fill available niches.'},
  {id:'act2-l3-x13',course:'act2',topic:'Evolution',difficulty:'Easy',text:'Antibiotic resistance in bacteria is a real-world example of:',choices:['Genetic engineering','Natural selection in action','Artificial selection only','Genetic drift exclusively'],correct:1,explain:'Bacteria with resistance survive and reproduce more, an example of selection at work.'},
  {id:'act2-l3-x14',course:'act2',topic:'Evolution',difficulty:'Medium',text:'Gene flow occurs when:',choices:['A population stops reproducing','Individuals migrate between populations, exchanging alleles','All mutations are eliminated','Species become extinct'],correct:1,explain:'Migration between populations introduces new alleles, increasing genetic exchange.'},
  {id:'act2-l3-x15',course:'act2',topic:'Evolution',difficulty:'Medium',text:'The fossil record provides evidence of evolution mainly by showing:',choices:['Instant appearance of all species at once','Gradual changes in species over geological time','That all species are identical','That extinction never occurs'],correct:1,explain:'Layers of fossils reveal how species have changed and diversified over millions of years.'},
  {id:'act2-l3-x16',course:'act2',topic:'Evolution',difficulty:'Hard',text:'Comparative embryology supports the theory of evolution by showing:',choices:['That all embryos are visually identical forever','Similarities in early development among related species','That embryos develop without any genetic instructions','That species never share common ancestry'],correct:1,explain:'Related species often show strikingly similar stages of embryonic development, hinting at shared ancestry.'},
  {id:'act2-l3-x17',course:'act2',topic:'Evolution',difficulty:'Easy',text:'A trait that increases an organism\'s chance of survival and reproduction is called:',choices:['A vestigial trait','An adaptive (advantageous) trait','A neutral trait','A lethal trait'],correct:1,explain:'Adaptive traits improve fitness, making them more likely to be passed to future generations.'},
  {id:'act2-l3-x18',course:'act2',topic:'Evolution',difficulty:'Hard',text:'The founder effect occurs when:',choices:['A large population splits evenly','A small group establishes a new population with limited genetic variation','Genetic diversity increases dramatically','Two species interbreed successfully'],correct:1,explain:'A new population founded by few individuals carries only a fraction of the original gene pool\'s diversity.'},

function loadDelta(sid){ try{ const raw=localStorage.getItem(LS_KEY+'_'+sid); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveDelta(sid,delta){ try{ localStorage.setItem(LS_KEY+'_'+sid,JSON.stringify(delta)); }catch(e){} }

function hydrateStudent(seed){
  const d=loadDelta(seed.id)||{};
  const st=JSON.parse(JSON.stringify(seed));
  st.completedLessons = Array.from(new Set([...st.completedLessons, ...(d.completedLessons||[])]));
  st.attempts = [...(st.attempts||[]), ...(d.attempts||[])];
  st.examAttempts = [...st.examAttempts, ...(d.examAttempts||[])];
  st.frqSubmitted = Array.from(new Set([...st.frqSubmitted, ...(d.frqSubmitted||[])]));
  st.solved = st.solved + (d.extraSolved||0);
  if(d.taskDone) st.taskDone = d.taskDone;
  if(d.courseProgressBump){ for(const c in d.courseProgressBump){ st.courseProgress[c]=Math.min(100,(st.courseProgress[c]||0)+d.courseProgressBump[c]); } }
  if(typeof d.accuracy==='number') st.accuracy=d.accuracy;
  return st;
}
function persistAction(sid,mutator){
  const d=loadDelta(sid)||{completedLessons:[],attempts:[],examAttempts:[],frqSubmitted:[],extraSolved:0,taskDone:[],courseProgressBump:{}};
  mutator(d);
  saveDelta(sid,d);
}

/* ---- Fullscreen lock-down for timed tests (mock exams + practice/HW sessions) ---- */
function requestFS(){
  const el2=document.documentElement;
  const fn=el2.requestFullscreen||el2.webkitRequestFullscreen||el2.mozRequestFullScreen||el2.msRequestFullscreen;
  if(fn) return fn.call(el2);
  return Promise.reject('Fullscreen not supported');
}
function exitFS(){
  const fn=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
  if(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement){ if(fn) fn.call(document); }
}
function isFullscreen(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); }
function onFullscreenChange(){
  if(!state.examLock) return;
  if(!isFullscreen()){
    state.examLock=false;
    if(state.view==='exam-session'){ toast('Exam auto-submitted — you exited full screen'); submitExam(true,'fullscreen'); }
    else if(state.view==='practice-session'){ toast('Session auto-submitted — you exited full screen'); finishPractice('fullscreen'); }
  }
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(ev=>document.addEventListener(ev,onFullscreenChange));

/* Session files are stored as real Blobs in IndexedDB (not base64 in
   localStorage) so actual video/PDF files — which are almost always
   several MB — save reliably instead of silently being dropped. */
const FILES_DB_NAME='helixbio_files_db';
const FILES_STORE='files';
let _filesDBPromise=null;
function openFilesDB(){
  if(_filesDBPromise) return _filesDBPromise;
  _filesDBPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject('IndexedDB not supported'); return; }
    const req=indexedDB.open(FILES_DB_NAME,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(FILES_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _filesDBPromise;
}
function saveFileBlob(key,blob){
  return openFilesDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(FILES_STORE,'readwrite');
    tx.objectStore(FILES_STORE).put(blob,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  }));
}
function getFileBlob(key){
  return openFilesDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(FILES_STORE,'readonly');
    const req=tx.objectStore(FILES_STORE).get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  }));
}

function hydrateSessionMedia(sessions){

        else if(mt.startsWith('audio/')) mediaEl.outerHTML=`<audio id="media-${s.id}" controls style="width:100%;margin-top:12px;"><source src="${url}" type="${mt}"></audio>`;
        else if(mt==='application/pdf') mediaEl.outerHTML=`<iframe id="media-${s.id}" src="${url}" style="width:100%;height:420px;border:0;border-radius:12px;margin-top:12px;"></iframe>`;

      const mediaEl=document.getElementById('media-'+s.id); if(mediaEl) mediaEl.innerHTML='<p style="color:#B23B3B;">Could not load this file.</p>';

/* =========================================================================
   REAL CONTENT MANAGEMENT (teacher actions actually save & take effect)
   Everything below persists to localStorage and mutates the live in-memory
   LESSONS / QUESTIONS / EXAMS / COURSES / TEACHER so the rest of the app,
   which reads those directly, reflects changes immediately — no separate
   "demo" data path.
========================================================================= */
function loadJSON(key,fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }
function saveJSON(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){ toast('Could not save — storage may be full.'); } }

const CUSTOM_LESSONS_KEY='helixbio_custom_lessons_v1';
const CUSTOM_QUESTIONS_KEY='helixbio_custom_questions_v1';
const CUSTOM_EXAMS_KEY='helixbio_custom_exams_v1';
const COURSE_OVERRIDES_KEY='helixbio_course_overrides_v1';
const TEACHER_PROFILE_KEY='helixbio_teacher_profile_v1';

function upsertById(arr,item){ const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); }

function saveLesson(lesson){
  upsertById(LESSONS,lesson);
  const store=loadJSON(CUSTOM_LESSONS_KEY,[]); upsertById(store,lesson); saveJSON(CUSTOM_LESSONS_KEY,store);
}
function saveQuestion(q){
  upsertById(QUESTIONS,q);
  const store=loadJSON(CUSTOM_QUESTIONS_KEY,[]); upsertById(store,q); saveJSON(CUSTOM_QUESTIONS_KEY,store);
}
function saveExam(exam){
  EXAMS[exam.id]=exam;
  const store=loadJSON(CUSTOM_EXAMS_KEY,{}); store[exam.id]=exam; saveJSON(CUSTOM_EXAMS_KEY,store);
}
function saveCourseOverride(courseId,partial){
  Object.assign(COURSES[courseId],partial);
  const store=loadJSON(COURSE_OVERRIDES_KEY,{}); store[courseId]=Object.assign(store[courseId]||{},partial); saveJSON(COURSE_OVERRIDES_KEY,store);
}
function saveTeacherProfile(partial){
  Object.assign(TEACHER,partial);
  saveJSON(TEACHER_PROFILE_KEY,{name:TEACHER.name,email:TEACHER.email});
}
function hydrateCustomContent(){
  loadJSON(CUSTOM_LESSONS_KEY,[]).forEach(l=>upsertById(LESSONS,l));
  loadJSON(CUSTOM_QUESTIONS_KEY,[]).forEach(q=>upsertById(QUESTIONS,q));
  Object.values(loadJSON(CUSTOM_EXAMS_KEY,{})).forEach(e=>{ EXAMS[e.id]=e; });
  const co=loadJSON(COURSE_OVERRIDES_KEY,{}); Object.keys(co).forEach(cid=>{ if(COURSES[cid]) Object.assign(COURSES[cid],co[cid]); });
  const tp=loadJSON(TEACHER_PROFILE_KEY,null); if(tp) Object.assign(TEACHER,tp);
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40); }
function nextExamId(course){ let n=1; while(EXAMS[course+'-custom-'+n]) n++; return course+'-custom-'+n; }
function nextLessonId(course,title){ let base=course+'-'+slugify(title||'lesson'); let id=base; let n=2; while(LESSONS.some(l=>l.id===id)){ id=base+'-'+n; n++; } return id; }
function nextQuestionId(course){ let n=1; let id=course+'-custom-q'+n; while(QUESTIONS.some(q=>q.id===id)){ n++; id=course+'-custom-q'+n; } return id; }

function courseTopicDatalist(course){ return TOPICS[course].map(t=>`<option value="${t}">`).join(''); }

/* ---------- PDF -> AI assessment helpers ---------- */
async function extractPdfText(file){
  if(!file) throw new Error('No PDF selected.');
  if(!window.pdfjsLib) throw new Error('PDF reader is still loading. Please try again.');
  const data=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    text += content.items.map(x=>x.str||'').join(' ')+'\n';
    if(text.length>180000) break;
  }
  return text.trim();
}
async function generateAIQuestionsFromPdf(file,{course,title,count=20,minutes=30,type='Homework'}={}){
  const text=await extractPdfText(file);
  if(!text) throw new Error('The PDF has no readable text.');
  if(!supabaseClient || !state.user?.id) throw new Error('Please sign in as a teacher first.');
  const {data,error}=await supabaseClient.functions.invoke('generate-assessment',{body:{
    course,title,count,minutes,type,sourceText:text,teacherId:state.user.id
  }});
  if(error) throw error;
  const questions=Array.isArray(data?.questions)?data.questions:[];
  if(!questions.length) throw new Error('AI did not return any questions.');
  return questions.map((q,i)=>({
    id:q.id||nextQuestionId(course)+'-ai-'+Date.now()+'-'+i,
    course:q.course||course,topic:q.topic||'PDF Generated',difficulty:q.difficulty||'Medium',
    text:q.text,choices:Array.isArray(q.choices)?q.choices.slice(0,4):[],correct:Number(q.correct||0),
    explain:q.explain||'AI-generated explanation from the uploaded PDF.',source:'ai-pdf',sourceFile:file.name
  })).filter(q=>q.text&&q.choices.length===4);
}
async function handleAssessmentPdfGeneration(file,opts){
  const questions=await generateAIQuestionsFromPdf(file,opts);
  questions.forEach(saveQuestion);
  return questions;
}

function pickN(course,n){
  const byTopic={}; QUESTIONS.filter(q=>q.course===course).forEach(q=>{ (byTopic[q.topic]=byTopic[q.topic]||[]).push(q.id); });
  const topics=Object.keys(byTopic); const ids=[]; let i=0;
  while(ids.length<n && topics.length){ const t=topics[i%topics.length]; const idx=Math.floor(i/topics.length); if(idx<byTopic[t].length) ids.push(byTopic[t][idx]); i++; if(i>1000) break; }
  return ids.slice(0,n);
}
async function submitExamForm(examId){
  const title=document.getElementById('efTitle').value.trim(), course=document.getElementById('efCourse').value;
  const count=Math.max(5,Math.min(100,parseInt(document.getElementById('efCount').value,10)||20));
  const minutes=Math.max(1,Math.min(240,parseInt(document.getElementById('efMinutes').value,10)||30));
  const pdf=document.getElementById('efPdf')?.files?.[0]||null;
  if(!title){toast('Please enter an exam title.');return;}
  const id=examId||nextExamId(course); const btn=document.getElementById('efSaveBtn'); if(btn){btn.disabled=true;btn.textContent=pdf?'Reading PDF + AI…':'Saving…';}
  try{
    let qids=examId&&EXAMS[examId]?.qids?EXAMS[examId].qids:pickN(course,count); let pdfUrl=EXAMS[id]?.pdfUrl||'',pdfFileKey=EXAMS[id]?.pdfFileKey||'',pdfFileName=EXAMS[id]?.pdfFileName||'';
    if(pdf){
      aiPdfStatus('efPdfStatus','Reading PDF and generating questions with AI…');
      const qs=await handleAssessmentPdfGeneration(pdf,{course,title,count,minutes,type:'Mock Exam'}); qids=qs.map(q=>q.id); pdfFileName=pdf.name;
      if(supabaseClient&&state.user?.id){const m=await uploadLessonMedia(pdf,'exam-'+id,'pdf');pdfUrl=m.url;pdfFileKey=m.path;}
      aiPdfStatus('efPdfStatus',`${qs.length} questions generated from ${pdf.name}.`,true);

    closeModal('examFormModal'); toast(examId?'Mock exam updated':'Mock exam created'); renderTeacherView();
  }catch(e){console.error(e);aiPdfStatus('efPdfStatus','AI generation failed: '+(e?.message||'Check the AI Edge Function.'));toast('Exam was not created from this PDF.');}

}

const WHATSAPP_NUMBERS={student:'',parent:'',parent2:'',sender:'01040934629'};
function whatsappIntl(number){
  const raw=String(number||'').trim();
  if(!raw) return '';
  if(raw.startsWith('+')) return raw.slice(1).replace(/\D/g,'');
  if(raw.startsWith('00')) return raw.slice(2).replace(/\D/g,'');
  const digits=raw.replace(/\D/g,'');
  return digits.startsWith('20') ? digits : ('20'+digits.replace(/^0+/,'') );
}
function waLink(number,text){ const intl=whatsappIntl(number); return intl?'https://wa.me/'+intl+'?text='+encodeURIComponent(text):''; }
function buildResultMessage(title,courseName,score,correct,total){
  const u=state.user;

  const dateStr=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

}
function sendResultToWhatsApp(title,courseName,score,correct,total){

function dnaHeroSvg(){
  let rungs='';
  for(let i=0;i<20;i++){
    const y=i*20-190; const angle=i*32;
    rungs+=`<div class="rung" style="transform:translateY(${y}px) rotateY(${angle}deg);"><div class="bar"></div><div class="dot a"></div><div class="dot b"></div></div>`;
  }
  let particles='';
  const pos=[[10,10,'8px','0s'],[85,20,'12px','1s'],[15,80,'10px','2s'],[80,75,'14px','.5s'],[45,5,'6px','1.5s']];
  pos.forEach(p=>{ particles+=`<div class="orbit-particle" style="left:${p[0]}%;top:${p[1]}%;width:${p[2]};height:${p[2]};animation-delay:${p[3]};"></div>`; });
  return `<div style="position:relative;width:100%;height:100%;">
    ${particles}
    <div class="cell-blob" style="width:120px;height:120px;left:0;top:20px;background:radial-gradient(circle at 35% 35%,var(--green-l),transparent 70%);"></div>
    <div class="cell-blob" style="width:160px;height:160px;right:-10px;bottom:0;background:radial-gradient(circle at 35% 35%,var(--blue-l),transparent 70%);"></div>
    <div class="dna-rotator" style="margin:0 auto;top:30px;">${rungs}</div>
  </div>`;
}

async function uploadLessonMedia(file, assignmentId, kind){
  if(!supabaseClient || !file) return null;
  const ext=(file.name.split('.').pop()||'bin').toLowerCase();
  const path=`${state.user?.id||'teacher'}/${assignmentId}/${kind}-${Date.now()}.${ext}`;
  const {error}=await supabaseClient.storage.from(SUPABASE_STORAGE_BUCKET).upload(path,file,{upsert:true,contentType:file.type||undefined});
  if(error) throw error;
  const {data}=supabaseClient.storage.from(SUPABASE_STORAGE_BUCKET).getPublicUrl(path);
  return {path,url:data?.publicUrl||''};

async function upsertLessonMediaToSupabase(a){
  if(!supabaseClient || !a) return;

async function doSupabaseLogin(email,pass){
  if(!supabaseClient) throw new Error('Supabase client did not load.');
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
  if(error) throw error;
  if(!data?.user) throw new Error('Login succeeded but no user was returned.');
  await ensureSupabaseProfile(data.user);
  await syncCoursesFromSupabase();
  await refreshAssignmentsShared();
  return data.user;
}

async function restoreSupabaseSession(){
  if(!supabaseClient) return;
  try{
    const {data}=await supabaseClient.auth.getSession();
    if(!data?.session?.user || state.user) return;
    const user=data.session.user;
    await ensureSupabaseProfile(user);
    // A restored Supabase session may exist on a different device/browser without
    // going through doLogin(). In that case assignments must still be pulled from
    // the shared database before rendering the student dashboard.
    await syncCoursesFromSupabase();
    await refreshAssignmentsShared();
    const profile=await getSupabaseProfile(user);
    const role=String(profile.role||'').toLowerCase();
    if(role==='teacher' || role==='admin'){
      state.role='teacher'; state.user={...TEACHER,...profile,email:user.email||profile.email,name:profile.name||TEACHER.name,id:user.id};
    }else{
      state.role='student'; state.user=studentFromSupabase(user,profile);
    }
    state.view='dashboard';
    render();
  }catch(_){ }
}

async function syncAssignmentsFromSupabase(){
  const remote=await refreshAssignmentsShared();
  if(remote) return remote;
  return null;
}

async function persistAssignmentsToSupabase(list){

  for(const a of list) await upsertAssignmentToSupabase(a);
}

async function doRegister(e){

  if(parent1===parent2){ authError='Please enter two different parent/guardian numbers.'; render(); return false; }

    const {data,error}=await supabaseClient.auth.signUp({
      email,password:pass,
      options:{data:{name,role:'student',system:systemForCourse(course),assigned_course:course,parentPhone1:parent1,parentPhone2:parent2}}

  const pass=document.getElementById('loginPassword').value;

  try{
    if(supabaseClient){
      const user=await doSupabaseLogin(email,pass);
      const profile=await getSupabaseProfile(user);
      const role=String(profile.role||'').toLowerCase();
      if(authMode==='teacher' && role!=='teacher' && role!=='admin'){
        await supabaseClient.auth.signOut();
        authError='This account is not marked as a teacher/admin account.';
        render(); return false;
      }
      if(authMode==='student' && (role==='teacher'||role==='admin')){
        await supabaseClient.auth.signOut();
        authError='Please use the Teacher tab for this account.';
        render(); return false;
      }
      if(role==='teacher'||role==='admin'){
        state.role='teacher';
        state.user={...TEACHER,...profile,email:user.email||email,name:profile.name||TEACHER.name,id:user.id};

      }

  if(totalAcc>=90) list.push('accuracy_90');
  if(u.solved>=100) list.push('questions_100');
