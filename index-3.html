function weakPointData(u){
  const rows=[];
  studentAllowedCourses(u).forEach(courseId=>{
    const perf=(u.topicPerf&&u.topicPerf[courseId])||{};
    Object.entries(perf).forEach(([topic,status])=>{
      if(status==='needs practice'){
        rows.push({courseId,topic,status,score:40});
      }else if(status==='good'){
        rows.push({courseId,topic,status,score:70});
      }else{
        rows.push({courseId,topic,status,score:90});
      }
    });

    (u.examAttempts||[])
      .filter(a=>EXAMS[a.examId] && EXAMS[a.examId].course===courseId)
      .forEach(a=>{
        if(Number(a.score)<80){
          rows.push({
            courseId,
            topic:'Exam Performance',
            status:'needs practice',
            score:Number(a.score),
            examScore:Number(a.score),
            examId:a.examId
          });
        }
      });
  });

  const unique={};
  rows.forEach(r=>{
    const key=r.courseId+'|'+r.topic;
    if(!unique[key] || r.score<unique[key].score) unique[key]=r;
  });
  return Object.values(unique).sort((a,b)=>a.score-b.score);
}

function weakPointQuestions(u,limit){
  const weak=weakPointData(u).filter(x=>x.status==='needs practice' && x.topic!=='Exam Performance');
  let pool=[];
  weak.forEach(w=>{
    pool.push(...QUESTIONS.filter(q=>q.course===w.courseId && q.topic===w.topic));
  });

  // Fallback to the complete enrolled question bank if the weak topics have
  // fewer banked questions than the student's requested session.
  if(pool.length < (limit||1)){
    studentAllowedCourses(u).forEach(courseId=>{
      pool.push(...QUESTIONS.filter(q=>q.course===courseId));
    });
  }

  // Unique question objects.
  const seen=new Set();
  pool=pool.filter(q=>{
    if(seen.has(q.id)) return false;
    seen.add(q.id);
    return true;
  });

  // Shuffle question order and independently shuffle every question's choices.
  // The answer key moves with the correct choice, so shuffling can never make
  // a correct answer become incorrect. We also avoid repeating the same
  // correct-answer letter on consecutive questions when possible.
  const shuffled=pool.slice().sort(()=>Math.random()-.5).slice(0,limit||8);
  let previousCorrectLetter=null;
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return shuffled.map(q=>{
    const choices=q.choices.map((text,idx)=>({text,idx}));
    let perm=choices.slice().sort(()=>Math.random()-.5);
    let correctPos=perm.findIndex(x=>x.idx===q.correct);
    if(previousCorrectLetter!==null && perm.length>1 && letters[correctPos]===previousCorrectLetter){
      const alternatives=[];
      for(let j=0;j<perm.length;j++) if(j!==correctPos) alternatives.push(j);
      const swapPos=alternatives[Math.floor(Math.random()*alternatives.length)];
      [perm[correctPos],perm[swapPos]]=[perm[swapPos],perm[correctPos]];
      correctPos=perm.findIndex(x=>x.idx===q.correct);
    }
    previousCorrectLetter=letters[correctPos];
    return {...q,choices:perm.map(x=>x.text),correct:correctPos};
  });
}

function startWeakPointPractice(){
  const countEl=document.getElementById('weakQuestionCount');
  const count=Math.min(2000,Math.max(1,Number(countEl?.value||10)));
  const available=QUESTIONS.length;
  const actual=Math.min(count, Math.max(available,1));
  const qs=weakPointQuestions(state.user,actual);
  if(!qs.length){
    toast('No questions are available yet. Complete more practice first.');
    return;
  }

  // Automatic timing: 45 seconds/question, minimum 5 minutes.
  const seconds=Math.max(5*60,qs.length*45);
  state.pendingPractice={
    course:qs[0].course,
    topic:'Weak Points',
    diff:'Any',
    qs,
    minutes:Math.ceil(seconds/60),
    isHW:false,
    weakPoints:true,
    autoTimed:true,
    totalSeconds:seconds
  };
  go('practice-gate');
}

function getYouTubeEmbedUrl(url){
  if(!url) return null;
  const m=String(url).match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1&playsinline=1` : null;

function youtubePlayerHtml(url,title='YouTube video'){
  const embed=getYouTubeEmbedUrl(url);
  if(!embed) return '';

  // For normal public/unlisted videos this works when the course is hosted over HTTP/HTTPS.
  // YouTube may reject iframe playback when this HTML is opened directly as content://;
  // that restriction is enforced by YouTube, not by the course code.
  return `<div class=\"course-video-player\" style=\"position:relative;width:100%;aspect-ratio:16/9;margin-top:12px;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);\">

  </div>`;
}

async function saveCourseLessonUpload(courseId,system){
  const title=document.getElementById('cuTitle')?.value.trim();
  const topic=document.getElementById('cuTopic')?.value.trim()||'Biology';
  if(!title){toast('Please enter the lesson title.');return;}
  const vf=document.getElementById('cuVideoFile')?.files?.[0]||null;
  const pf=document.getElementById('cuPdfFile')?.files?.[0]||null;
  const vu=document.getElementById('cuVideoUrl')?.value.trim()||'';
  const pu=document.getElementById('cuPdfUrl')?.value.trim()||'';
  if(!vf && !vu && !pf && !pu){toast('Add a YouTube video link, video file, PDF file, or PDF URL first.');return;}
  const btn=document.querySelector('.course-upload-save'); if(btn){btn.disabled=true;btn.textContent='Uploading…';}
  const id=system+'-'+courseId+'-'+Date.now();
  const item={id,system,course:courseId,title,topic,videoUrl:vu,pdfUrl:pu,videoLabel:'Watch video',pdfLabel:'Open PDF'};
  try{
    if(supabaseClient && state.user?.id){
      if(vf){ const m=await uploadLessonMedia(vf,id,'video'); item.videoUrl=m.url; item.videoFileKey=m.path; item.videoFileName=vf.name; item.videoMimeType=vf.type; }
      if(pf){ const m=await uploadLessonMedia(pf,id,'pdf'); item.pdfUrl=m.url; item.pdfFileKey=m.path; item.pdfFileName=pf.name; item.pdfMimeType=pf.type||'application/pdf'; }
      const ok=await upsertAssignmentToSupabase(item);
      if(!ok) throw new Error('Database save failed');
      await upsertLessonMediaToSupabase(item);
      const list=loadAssignments().filter(x=>x.id!==id); list.push(item); localStorage.setItem(ASSIGNMENT_STORE_KEY,JSON.stringify(list));
      toast('Lesson saved to the shared database. Students can see it from any device.');
    }else{
      if(vf){ item.videoFileKey=id+'-video'; await saveFileBlob(item.videoFileKey,vf); item.videoFileName=vf.name; item.videoMimeType=vf.type; }
      if(pf){ item.pdfFileKey=id+'-pdf'; await saveFileBlob(item.pdfFileKey,pf); item.pdfFileName=pf.name; item.pdfMimeType=pf.type||'application/pdf'; }
      const list=loadAssignments(); list.push(item); saveAssignments(list);
      toast('Saved locally. Connect Supabase to share uploads across devices.');
    }
    openCourseUploadEditor(courseId);
  }catch(e){ console.error(e); toast('Upload failed: '+(e?.message||'Please check Supabase Storage/RLS and try again.')); }
  finally{ if(btn){btn.disabled=false;btn.textContent='Save Lesson & Upload Content →';} }
}

function overallExpectedScore(u){
  const attempts=Array.isArray(u?.examAttempts)?u.examAttempts.map(a=>Number(a.score)).filter(Number.isFinite):[];
  if(attempts.length) return Math.round(attempts.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,attempts.length));
  const acc=Number(u?.accuracy); if(Number.isFinite(acc)&&acc>0) return Math.round(acc);
  const allowed=studentAllowedCourses(u); return Math.round(allowed.reduce((s,c)=>s+Number(u?.courseProgress?.[c]||0),0)/(allowed.length||1));
}

function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function shuffleQuestionChoices(qs){
  const counts=[0,0,0,0]; let previousCorrect=-1;
  return qs.map(q=>{
    const items=q.choices.map((text,idx)=>({text,idx}));
    // Prefer a correct-answer position that is both different from the previous
    // question and currently least-used, so A/B/C/D stay naturally mixed.
    const candidates=[0,1,2,3].filter(pos=>pos!==previousCorrect);
    const min=Math.min(...candidates.map(pos=>counts[pos]));
    const target=candidates.filter(pos=>counts[pos]===min)[Math.floor(Math.random()*candidates.filter(pos=>counts[pos]===min).length)];
    const distractors=shuffleArray(items.filter(x=>x.idx!==q.correct));
    const perm=[]; let di=0;
    for(let pos=0;pos<4;pos++) perm[pos]=pos===target?items.find(x=>x.idx===q.correct):distractors[di++];
    counts[target]++; previousCorrect=target;
    return {...q,choices:perm.map(x=>x.text),correct:target};
  });
}

  const qs=shuffleQuestionChoices(raw);

  state.pendingPractice={course:l.course,topic:l.topic,diff:'Any',qs,minutes,isHW:true,lessonId:l.id,lessonTitle:l.title};

function studentFRQ(){
  const u=state.user;
  return `<div class="topline"><h1>AP Biology FRQ Practice</h1></div>

    ${FRQS.map(f=>{ const submitted=u.frqSubmitted.includes(f.id);
      return `<div class="card" style="margin-bottom:16px;">
        <div class="q-meta"><span class="pill pill-purple">${f.points} points</span>${submitted?'<span class="pill pill-green">Submitted</span>':''}</div>
        <div class="q-text">${f.prompt}</div>
        <textarea class="frq-answer-box" id="frq-${f.id}" placeholder="Write your response here..."></textarea>
        <div style="display:flex;gap:10px;margin-top:12px;">
          <button class="btn btn-green" onclick="submitFRQ('${f.id}')">Submit Response</button>
          <button class="btn btn-ghost" onclick="toggleModel('${f.id}')">View Model Answer</button>
        </div>
        <div id="frqfeedback-${f.id}"></div>
        <div id="frqmodel-${f.id}" class="hidden explain-box" style="margin-top:12px;"><b>Model Answer:</b><br>${f.sample}</div>
      </div>`; }).join('')}
  </div>
  <div>
    <div class="card">
      <div class="section-label">How FRQ scoring works</div>
      <p>This is a demo scoring tool — it checks your response for key rubric concepts rather than providing perfectly accurate AI grading. Use it to self-check, then compare closely with the model answer.</p>
    </div>
  </div>
  </div>`;
}
function toggleModel(id){ document.getElementById('frqmodel-'+id).classList.toggle('hidden'); }
function submitFRQ(id){
  const f=FRQS.find(x=>x.id===id);
  const text=document.getElementById('frq-'+id).value.toLowerCase();
  let hits=0;
  const keywordSets=[/active site|substrate|specific/,/tertiary|shape|structure/,/temperature|heat|denature/,/ph/, /heritable|variation/,/predator|pressure|selective/,/survive|reproduc/,/allele frequenc|generation/, /diploid|identical/,/haploid|gamete/,/crossing over|independent assortment|variation/,/division/];
  keywordSets.forEach(rx=>{ if(rx.test(text)) hits++; });
  const scoreEst=Math.min(f.points, Math.max(0,Math.round((hits/3))));
  document.getElementById('frqfeedback-'+id).innerHTML=`<div class="explain-box" style="margin-top:12px;"><b>Estimated rubric coverage: ${scoreEst}/${f.points}</b><br>This is a rule-based estimate for demo purposes — compare your response against the rubric points below.<ul style="margin:10px 0 0;padding-left:18px;">${f.rubric.map(r=>'<li>'+r+'</li>').join('')}</ul></div>`;
  persistAction(state.user.id,d=>{ if(!d.frqSubmitted.includes(id)) d.frqSubmitted.push(id); });
  state.user.frqSubmitted = Array.from(new Set([...state.user.frqSubmitted,id]));
  toast('FRQ response submitted');
}

function completeLesson(lessonId){
  const u=state.user; const l=LESSONS.find(x=>x.id===lessonId);

  u.completedLessons.push(lessonId);

  ${LESSONS.map(l=>`<tr><td><b style="color:var(--navy);">${l.title}</b></td><td>${COURSES[l.course].short}</td><td>${l.topic}</td><td>${(sessions[l.id]||[]).length} uploaded</td><td style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openLessonForm('${l.id}')">Edit</button><button class="btn btn-green btn-sm" onclick="event.stopPropagation();openUploadSessionModal('${l.id}')">Upload Session</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function teacherQBank(){
  return `<div class="topline"><h1>Question Bank</h1><button class="btn btn-primary btn-sm" onclick="openQuestionForm(null)">+ Add Question</button></div>
  <div class="card"><table class="data-table"><thead><tr><th>Question</th><th>Course</th><th>Topic</th><th>Difficulty</th><th>Actions</th></tr></thead><tbody>
  ${QUESTIONS.map(q=>`<tr><td style="max-width:340px;">${q.text}</td><td>${COURSES[q.course].short}</td><td>${q.topic}</td><td><span class="pill pill-amber">${q.difficulty}</span></td><td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openQuestionForm('${q.id}')">Edit</button></td></tr>`).join('')}

function teacherExams(){
  return `<div class="topline"><h1>Exams</h1><button class="btn btn-primary btn-sm" onclick="openExamForm(null)">+ Create Exam</button></div>
  <div class="grid-3">${Object.values(EXAMS).map(e=>`<div class="course-card"><div class="icon icon-${e.course==='ap'?'ap':(e.course==='est2'?'est':'act')}">${icon('exam',22)}</div><span class="tag">${COURSES[e.course].short}</span><h3>${e.title}</h3><p>${e.qids.length} questions · ${e.minutes} min${e.pdfFileName?' · AI PDF':''}</p><div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-outline btn-sm" style="flex:1;" onclick="openExamForm('${e.id}')">Edit</button><button class="btn btn-ghost btn-sm" style="flex:1;" onclick="go('t-exam-performance',{teacherExamId:'${e.id}'})">Performance</button></div></div>`).join('')}</div>`;

function teacherExamPerformance(){
  const e=EXAMS[state.teacherExamId]; if(!e) return teacherExams();
  const students=allStudentsHydrated().filter(s=>s.enrolled.includes(e.course));
  return `<div class="topline"><div><button class="btn btn-ghost btn-sm" onclick="go('t-exams')">&larr; All Exams</button><h1 style="margin-top:12px;">${e.title}</h1><p>${e.qids.length} questions · ${e.minutes} min · ${COURSES[e.course].name}</p></div></div>
  <div class="card"><table class="data-table"><thead><tr><th>Student</th><th>Attempts</th><th>Best Score</th><th>Last Attempt</th></tr></thead><tbody>
  ${students.map(s=>{ const attempts=s.examAttempts.filter(a=>a.examId===e.id); const best=attempts.length?Math.max(...attempts.map(a=>a.score)):null; const last=attempts.length?attempts[attempts.length-1]:null;
    return `<tr onclick="go('t-student-detail',{teacherStudentId:'${s.id}'})"><td><div style="display:flex;align-items:center;gap:10px;">${avatarSvg(studentAvatarId(s),28)}<b style="color:var(--navy);">${s.name}</b></div></td><td>${attempts.length}</td><td>${best!==null?best+'%':'Not attempted'}</td><td>${last?last.date:'—'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function teacherAnalytics(){
  return `<div class="topline"><h1>Analytics</h1></div>
  <div class="grid-2">
    <div class="chart-card"><h4>Average Score by Course</h4><canvas id="chartTA1" height="200"></canvas></div>
    <div class="chart-card"><h4>Student Progress Distribution</h4><canvas id="chartTA2" height="200"></canvas></div>
  </div>`;
}
function renderTeacherAnalyticsCharts(){
  if(!window.Chart) return;
  const students=allStudentsHydrated();
  const raw=students.map(s=>({name:s.name.split(' ')[0],progress:Math.round(s.enrolled.reduce((a,c)=>a+(s.courseProgress[c]||0),0)/s.enrolled.length),score:s.accuracy,enrolled:s.enrolled,accuracy:s.accuracy}));
  const c1=document.getElementById('chartTA1');
  if(c1){ const courses=['ap','est2','act2']; const data=courses.map(c=>{ const rel=raw.filter(s=>s.enrolled.includes(c)); return rel.length?Math.round(rel.reduce((a,s)=>a+s.accuracy,0)/rel.length):0; });
    new Chart(c1,{type:'bar',data:{labels:['AP Bio','EST 2','ACT 2'],datasets:[{data,backgroundColor:['#6C4FBB','#3E7CB1','#3FA772'],borderRadius:8}]},options:{animation:{duration:1300,easing:'easeOutQuart'},plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}}); }
  const c2=document.getElementById('chartTA2');
  if(c2){ new Chart(c2,{type:'bar',data:{labels:raw.map(s=>s.name),datasets:[{label:'Progress %',data:raw.map(s=>s.progress),backgroundColor:'#3E7CB1',borderRadius:6},{label:'Avg Score %',data:raw.map(s=>s.score),backgroundColor:'#3FA772',borderRadius:6}]},options:{animation:{duration:1300,easing:'easeOutQuart'},scales:{y:{min:0,max:100}}}}); }
}
function teacherSettings(){
  return `<div class="topline"><h1>Settings</h1></div>
  <div class="card" style="max-width:520px;">
    <div class="section-label">Teacher Profile</div>
    <div class="field"><label>Name</label><input id="tsName" value="${TEACHER.name}"></div>
    <div class="field"><label>Email</label><input id="tsEmail" value="${TEACHER.email}"></div>
    <p class="hint" style="margin-bottom:12px;">This is the email you use to log in — changing it takes effect next login.</p>
    <button class="btn btn-green" onclick="saveTeacherSettingsForm()">Save Changes</button>
  </div>`;
}
function saveTeacherSettingsForm(){
  const name=document.getElementById('tsName').value.trim();
  const email=document.getElementById('tsEmail').value.trim().toLowerCase();
  if(!name||!email){ toast('Name and email are required.'); return; }
  saveTeacherProfile({name,email});
  toast('Settings saved');
  renderTeacherApp();
}

/* Weak-point sessions intentionally defer correctness feedback until submission. */
const _originalGo = window.go;
if(typeof _originalGo==='function' && !window.__weakPointGoWrapped){
  window.__weakPointGoWrapped=true;
  window.go=function(view){
    return _originalGo.apply(this,arguments);
  };
}



/* Local file upload helper: teacher can pick video/PDF files and the current
   browser session immediately exposes them to students. For production,
   replace the object URL with Supabase Storage upload. */
window.uploadLessonFile=function(system,type){
  const input=document.createElement('input');
  input.type='file';
  input.accept=type==='pdf'?'.pdf,application/pdf':'video/*';
  input.onchange=function(){
    const file=input.files&&input.files[0]; if(!file)return;
    const title=prompt('Lesson title for this file');
    if(!title)return;
    const topic=prompt('Topic');
    const id=system+'-'+type+'-'+Date.now();
    const fileKey='assignment-file-'+id;
    saveFileBlob(fileKey,file).then(()=>{
      const list=loadAssignments();
      list.push({id,system,course:system==='act'?'act2':(system==='ap'?'ap':'est2'),
        title:title||file.name,topic:topic||'Biology',
        videoUrl:type==='video'?'':'',pdfUrl:type==='pdf'?'':'',
        videoFileKey:type==='video'?fileKey:'',pdfFileKey:type==='pdf'?fileKey:'',
        videoLabel:'Watch video',pdfLabel:'Open PDF',localFile:true,mimeType:file.type,fileName:file.name});
      saveAssignments(list);
      showTeacherSystem(system);
      toast(type==='pdf'?'PDF added for this lesson.':'Video added for this lesson.');
    }).catch(()=>toast('Could not save the file — try a smaller file.'));
  };
  input.click();
};
