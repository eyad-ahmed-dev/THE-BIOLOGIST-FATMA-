<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Biologist Fatma — EST2 · ACT2 · AP Biology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --navy:#5A1025;
  --navy-2:#731B35;
  --navy-3:#8E2945;
  --green:#8E2945;
  --green-l:#F6E7EC;
  --green-d:#6F1830;
  --blue:#9A3B58;
  --blue-l:#F8EAF0;
  --bg:#FAFAF7;
  --bg-2:#F2F2ED;
  --card:#FFFFFF;
  --ink:#0F1826;
  --muted:#606A78;
  --muted-2:#88919C;
  --border:#E6E8EC;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-sm:0 2px 10px rgba(90,16,37,.08);
  --shadow-md:0 10px 34px rgba(90,16,37,.12);
  --shadow-lg:0 22px 60px rgba(90,16,37,.16);
  --font-d:'Fraunces',serif;
  --font-b:'Inter',sans-serif;
  --font-m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;color:var(--navy);letter-spacing:-.01em;}
p{margin:0;color:var(--muted);line-height:1.6;}
a{color:inherit;}
button{font-family:var(--font-b);cursor:pointer;}
::selection{background:var(--green-l);color:var(--navy);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;} }

.hidden{display:none !important;}
.mono{font-family:var(--font-m);}
.container{max-width:1180px;margin:0 auto;padding:0 28px;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:13px 24px;border-radius:100px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--navy-2);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-d);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.btn-outline{background:transparent;border-color:var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy);color:#fff;}
.btn-ghost{background:var(--bg-2);color:var(--navy);border-color:transparent;}
.btn-ghost:hover{background:var(--border);}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:100px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* ============ TOPBAR (marketing) ============ */
.topbar{position:sticky;top:0;z-index:40;background:rgba(250,250,247,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:600;font-size:20px;color:var(--navy);cursor:pointer;}
.brand-mark{width:32px;height:32px;flex:none;}
.topnav{display:flex;gap:28px;align-items:center;}
.topnav a{font-size:14.5px;font-weight:500;color:var(--navy-2);cursor:pointer;text-decoration:none;}
.topnav a:hover{color:var(--green-d);}
.topbar-cta{display:flex;gap:10px;}
.burger{display:none;background:none;border:none;padding:8px;}
@media (max-width:880px){ .topnav{display:none;} .burger{display:block;} }

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;padding:76px 0 60px;}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;}
@media (max-width:960px){ .hero-grid{grid-template-columns:1fr;} }
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;background:var(--green-l);color:var(--green-d);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:22px;}
.hero h1{font-size:clamp(38px,5.2vw,60px);line-height:1.04;font-weight:600;color:var(--navy);}
.hero h1 em{font-style:italic;color:var(--green-d);}
.hero p.lead{margin-top:20px;font-size:18px;max-width:520px;color:var(--muted);}
.hero-ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;}
.hero-stats{display:flex;gap:0;margin-top:52px;border-top:1px solid var(--border);padding-top:26px;flex-wrap:wrap;}
.hero-stat{flex:1;min-width:130px;padding-right:20px;}
.hero-stat .num{font-family:var(--font-m);font-weight:600;font-size:22px;color:var(--navy);}
.hero-stat .lbl{font-size:12.5px;color:var(--muted-2);margin-top:4px;}

/* ---- DNA helix (signature element) ---- */
.dna-wrap{position:relative;height:460px;display:flex;align-items:center;justify-content:center;perspective:900px;}
.dna-rotator{position:relative;width:170px;height:400px;transform-style:preserve-3d;animation:spin 12s linear infinite;}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.rung{position:absolute;left:50%;top:50%;width:150px;height:0;}
.rung .bar{position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--navy-3),var(--green));border-radius:3px;opacity:.85;}
.rung .dot{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px rgba(63,167,114,.12);}
.rung .dot.a{left:-6px;background:var(--navy-3);}
.rung .dot.b{right:-6px;background:var(--green);}
.orbit-particle{position:absolute;border-radius:50%;background:var(--blue);opacity:.35;animation:float 7s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(-22px) translateX(10px);}}
.cell-blob{position:absolute;border-radius:50%;filter:blur(0);opacity:.5;}
.hero::before{content:'';position:absolute;top:-160px;right:-160px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--blue-l),transparent 70%);pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:-200px;left:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--green-l),transparent 70%);pointer-events:none;}

/* ============ SECTIONS ============ */
.section{padding:84px 0;}
.section-head{max-width:640px;margin:0 auto 46px;text-align:center;}
.section-head h2{font-size:clamp(28px,3.6vw,40px);font-weight:600;}
.section-head p{margin-top:14px;font-size:16.5px;}
.section-tight .section-head{margin-bottom:34px;}
.section-alt{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}

/* course cards */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media (max-width:920px){ .course-grid{grid-template-columns:1fr;} }
.course-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px;transition:transform .22s ease, box-shadow .22s ease;position:relative;overflow:hidden;}
@keyframes wiggleLR{0%{transform:translateX(0);}25%{transform:translateX(-7px);}50%{transform:translateX(6px);}75%{transform:translateX(-3px);}100%{transform:translateX(0);}}
.hover-lr:hover{animation:wiggleLR .5s ease;}
.course-card:hover{box-shadow:var(--shadow-lg);animation:wiggleLR .5s ease;}
.course-card .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.course-card h3{font-size:22px;margin-bottom:8px;}
.course-card .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px;}
.course-card ul{margin:16px 0 22px;padding:0;list-style:none;}
.course-card li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);padding:5px 0;}
.course-card li svg{flex:none;margin-top:3px;}
.icon-est{background:var(--blue-l);color:var(--blue);}
.icon-act{background:var(--green-l);color:var(--green-d);}
.icon-ap{background:#EFE9FB;color:#6C4FBB;}

/* glass panel */
.glass{background:rgba(255,255,255,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);}

/* how it works / features */
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:920px){ .feat-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:560px){ .feat-grid{grid-template-columns:1fr;} }
.feat{padding:26px 22px;border-radius:var(--radius-md);background:var(--bg-2);}
.feat .n{font-family:var(--font-m);font-size:12px;color:var(--green-d);font-weight:600;}
.feat h4{margin-top:10px;font-size:17px;}
.feat p{margin-top:8px;font-size:13.8px;}

.cta-band{border-radius:28px;background:linear-gradient(135deg,var(--navy),var(--navy-3));padding:56px 48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden;}
.cta-band h2{color:#fff;font-size:30px;max-width:460px;}
.cta-band p{color:#B8C6DC;margin-top:10px;}
.footer{padding:40px 0 60px;border-top:1px solid var(--border);}
.footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:13.5px;color:var(--muted-2);}

/* ============ AUTH ============ */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:
  radial-gradient(circle at 15% 20%, var(--green-l), transparent 45%),
  radial-gradient(circle at 85% 80%, var(--blue-l), transparent 45%), var(--bg);}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:38px 34px;box-shadow:var(--shadow-lg);}
.auth-back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:18px;cursor:pointer;}
.auth-tabs{display:flex;background:var(--bg-2);border-radius:100px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:100px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s;}
.auth-tab.active{background:var(--navy);color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy-2);margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font-size:14.5px;background:var(--bg);font-family:var(--font-b);}
.field textarea{resize:vertical;min-height:70px;}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:5px;}
.modal.modal-wide{max-width:640px;}
.choice-input-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.choice-input-row input[type=radio]{width:18px;height:18px;flex:none;}
.choice-input-row input[type=text]{flex:1;}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}
.auth-error{background:#FDEEEE;color:#B23B3B;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
.demo-list{margin-top:22px;border-top:1px dashed var(--border);padding-top:18px;}
.demo-list p.h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:10px;}
.demo-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--bg-2);margin-bottom:7px;font-size:12.8px;cursor:pointer;transition:.15s;}
.demo-row:hover{background:var(--green-l);animation:wiggleLR .5s ease;}
.demo-row .who{font-weight:600;color:var(--navy);}
.demo-row .meta{color:var(--muted-2);font-family:var(--font-m);font-size:11px;}

/* ============ APP SHELL ============ */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:246px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.sidebar .brand{color:#fff;padding:0 8px;margin-bottom:26px;}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:20px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}

/* ---- animated 3D-style avatar creature ---- */
.avatar-creature{border-radius:50%;flex:none;overflow:visible;cursor:default;}
.avatar-creature .body{animation:avatarBob 2.4s ease-in-out infinite;transform-origin:center;}
.avatar-creature .eye{animation:avatarBlink 3.6s ease-in-out infinite;transform-origin:center;}
@keyframes avatarBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(-4deg);}}
@keyframes avatarBlink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.15);}}
.avatar-pick{border-radius:16px;border:2px solid transparent;padding:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg-2);transition:.15s;}
.avatar-pick:hover{background:var(--green-l);animation:wiggleLR .5s ease;}
.avatar-pick.selected{border-color:var(--green);background:var(--green-l);}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;}

/* ---- session cards (teacher-uploaded lesson sessions) ---- */
.session-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:var(--card);transition:box-shadow .2s ease;}
.session-card:hover{box-shadow:var(--shadow-md);animation:wiggleLR .5s ease;}
.session-card .sicon{width:40px;height:40px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;}
.session-card .sinfo{flex:1;min-width:0;}
.session-card .sinfo h5{font-size:14px;color:var(--navy);font-weight:600;}
.session-card .sinfo span{font-size:11.5px;color:var(--muted-2);}
.upload-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px dashed var(--border);border-radius:12px;margin-top:10px;background:var(--bg-2);}
.stat-box{position:relative;}
.stat-box .sicon2{position:absolute;top:16px;right:16px;color:var(--green);opacity:.55;}
.side-user .name{font-size:13.5px;font-weight:600;}
.side-user .role{font-size:11px;color:#93A3BE;}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.side-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:#B8C6DC;font-size:14px;font-weight:500;transition:.15s;}
.side-link svg{flex:none;opacity:.85;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:var(--green);color:#fff;}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.logout-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#B8C6DC;font-size:13.5px;cursor:pointer;}
.logout-link:hover{color:#fff;}
.main{flex:1;min-width:0;padding:30px 36px 60px;}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
.topline h1{font-size:26px;}
.mobile-topbar{display:none;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:14px 18px;align-items:center;justify-content:space-between;}
@media (max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:50;transition:left .25s ease;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .mobile-topbar{display:flex;}
  .main{padding:20px 16px 50px;}
}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(11,31,58,.4);z-index:45;}
.sidebar-scrim.show{display:block;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;}
.hw-bar{border-color:var(--green);background:var(--green-l);}
.grid-2{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;}
@media (max-width:1000px){ .grid-2{grid-template-columns:1fr;} }
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:900px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-4{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;} }

.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
.stat-box .lbl{font-size:12px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-box .val{font-family:var(--font-m);font-size:25px;font-weight:600;color:var(--navy);margin-top:6px;}
.stat-box .sub{font-size:12px;color:var(--green-d);margin-top:4px;}

/* progress ring */
.ring-wrap{position:relative;width:150px;height:150px;margin:0 auto;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg-2);stroke-width:12;}
.ring-fg{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label .pct{font-family:var(--font-m);font-size:26px;font-weight:600;color:var(--navy);}
.ring-label .txt{font-size:11px;color:var(--muted-2);}

/* progress bar */
.pbar{height:8px;border-radius:100px;background:var(--bg-2);overflow:hidden;}
.pbar > div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:100px;transition:width .8s ease;}

/* course-mini card in dashboard */
.mini-course{border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;background:var(--card);transition:box-shadow .2s ease;}
.mini-course:hover{box-shadow:var(--shadow-md);animation:wiggleLR .5s ease;}
.mini-course .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.mini-course h4{font-size:16.5px;}
.mini-course .stats-row{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap;}
.mini-course .stats-row div{font-size:12px;color:var(--muted);}
.mini-course .stats-row b{display:block;font-family:var(--font-m);color:var(--navy);font-size:15px;}
.pill{display:inline-block;padding:4px 11px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.pill-blue{background:var(--blue-l);color:var(--blue);}
.pill-green{background:var(--green-l);color:var(--green-d);}
.pill-purple{background:#EFE9FB;color:#6C4FBB;}
.pill-amber{background:#FDF3E3;color:#B0770C;}
.pill-red{background:#FDEEEE;color:#B23B3B;}

/* lesson list */
.lesson-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:var(--card);transition:.15s;}
.lesson-row:hover{border-color:var(--green);animation:wiggleLR .5s ease;}
.lesson-row .chk{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;}
.chk.done{background:var(--green);color:#fff;}
.chk.todo{background:var(--bg-2);color:var(--muted-2);border:1px solid var(--border);}
.lesson-row .info{flex:1;min-width:0;}
.lesson-row .info h5{font-size:14.5px;color:var(--navy);font-weight:600;}
.lesson-row .info span{font-size:12px;color:var(--muted-2);}

/* topic performance bars */
.topic-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);}
.topic-row:last-child{border-bottom:none;}
.topic-row .tname{flex:0 0 220px;font-size:13.5px;font-weight:500;color:var(--navy-2);}
.topic-row .tbar{flex:1;}
@media (max-width:640px){ .topic-row{flex-wrap:wrap;} .topic-row .tname{flex:1 1 100%;} }

/* question card */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;}
.q-meta{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.q-text{font-size:17px;color:var(--navy);font-weight:500;line-height:1.5;margin-bottom:20px;}
.choice{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.15s;font-size:14.5px;}
.choice:hover{border-color:var(--blue);background:var(--blue-l);animation:wiggleLR .4s ease;}
.choice .letter{width:26px;height:26px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;}
.choice.selected{border-color:var(--navy);background:var(--bg-2);}
.choice.correct{border-color:var(--green);background:var(--green-l);}
.choice.incorrect{border-color:#D66;background:#FDEEEE;}
.choice.disabled{pointer-events:none;}
.explain-box{margin-top:16px;padding:16px;border-radius:14px;background:var(--bg-2);font-size:13.8px;color:var(--navy-2);}

/* exam nav grid */
.exam-nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.exam-nav-btn{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--card);font-family:var(--font-m);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;}
.exam-nav-btn.current{border-color:var(--navy);background:var(--navy);color:#fff;}
.exam-nav-btn.answered{background:var(--green-l);color:var(--green-d);border-color:var(--green);}
.exam-nav-btn.flagged::after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#E0A800;}

.timer-pill{font-family:var(--font-m);background:var(--navy);color:#fff;padding:9px 18px;border-radius:100px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}

/* table */
table.data-table{width:100%;border-collapse:collapse;font-size:13.8px;}
table.data-table th{text-align:left;padding:12px 14px;color:var(--muted-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
table.data-table td{padding:14px;border-bottom:1px solid var(--border);color:var(--navy-2);}
table.data-table tr:hover td{background:var(--bg-2);}
table.data-table tr{cursor:pointer;}

.badge-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
.dot{width:7px;height:7px;border-radius:50%;}
.dot-green{background:var(--green);}
.dot-amber{background:#E0A800;}
.dot-red{background:#D66;}

/* achievements */
.ach-card{border-radius:var(--radius-md);padding:20px;text-align:center;border:1px solid var(--border);background:var(--card);transition:box-shadow .2s ease;}
.ach-card:not(.locked):hover{box-shadow:var(--shadow-md);animation:wiggleLR .5s ease;}
.ach-card .emoji{font-size:34px;}
.ach-card h5{font-size:14px;margin-top:10px;color:var(--navy);}
.ach-card p{font-size:12px;margin-top:4px;}
.ach-card.locked{opacity:.4;filter:grayscale(1);}

/* study plan */
.task-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card);}
.task-row.done{opacity:.55;}
.task-row .tdone{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;}
.task-row .tdone.checked{background:var(--green);border-color:var(--green);color:#fff;}
.task-row .tinfo{flex:1;}
.task-row .tinfo .t{font-size:14px;font-weight:500;color:var(--navy);}
.task-row .tinfo .t.strike{text-decoration:line-through;color:var(--muted-2);}
.task-row .tinfo .m{font-size:11.5px;color:var(--muted-2);}

.section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:14px;}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:14px 22px;border-radius:100px;font-size:13.8px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;align-items:center;gap:10px;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* chart card */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;}
.chart-card h4{font-size:15px;margin-bottom:16px;}
canvas{max-width:100%;}

/* fade-in */
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.frq-answer-box{width:100%;min-height:160px;border:1px solid var(--border);border-radius:14px;padding:14px;font-family:var(--font-b);font-size:14px;resize:vertical;}
.frq-answer-box:focus{outline:2px solid var(--green);border-color:var(--green);}

.fs-gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;}
.fs-gate-card{max-width:480px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 34px;text-align:center;box-shadow:var(--shadow-lg);}
.fs-gate-card .fsicon{width:70px;height:70px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.fs-gate-card h2{font-size:22px;}
.fs-gate-card p{margin-top:12px;}
.fs-gate-rules{text-align:left;background:var(--bg-2);border-radius:14px;padding:16px 18px;margin-top:22px;font-size:13px;color:var(--muted);}
.fs-gate-rules li{margin-bottom:6px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,31,58,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted-2);}
.empty-state svg{margin-bottom:14px;opacity:.5;}

/* Pointer micro-interactions */
button,a,.side-link,.logout-link,.choice,.demo-row,.avatar-pick,.course-card,
.mini-course,.lesson-row,.session-card,.ach-card,.task-row,.exam-nav-btn,
.stat-box,.card,.pill{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,
  background .18s ease,border-color .18s ease,color .18s ease;
}
button:hover,a:hover,.side-link:hover,.logout-link:hover,.choice:hover,
.demo-row:hover,.avatar-pick:hover,.course-card:hover,.mini-course:hover,
.lesson-row:hover,.session-card:hover,.ach-card:hover,.task-row:hover,
.exam-nav-btn:hover{
  transform:translateY(-3px);
}
button:active,.choice:active,.side-link:active,.logout-link:active,
.demo-row:active,.avatar-pick:active{
  transform:translateY(0) scale(.985);
}


.weak-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
.weak-row:last-child,.weak-topic:last-child{border-bottom:0;}
.weak-rank{width:32px;height:32px;border-radius:10px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;flex:0 0 auto;}
.weak-main{flex:1;min-width:0;}
.weak-title{font-weight:700;color:var(--navy);}
.weak-meta{font-size:11.5px;color:var(--muted-2);margin-top:3px;}
.weak-badge{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:#FDECEF;color:#9B2748;white-space:nowrap;}
.weak-topic{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.weak-topic b{font-size:13px;color:var(--navy);}
.weak-status{font-size:10.5px;font-weight:700;border-radius:999px;padding:5px 8px;white-space:nowrap;}
.weak-status.bad{background:#FDECEF;color:#9B2748;}
.weak-status.mid{background:#FFF4DB;color:#946A12;}
.weak-status.ok{background:var(--green-l);color:var(--green-d);}
.weak-question-list{display:grid;gap:9px;margin-top:18px;}
.weak-q{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:13px;padding:12px 13px;background:var(--bg-2);}
.weak-q-num{width:27px;height:27px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto;}
.weak-q b{font-size:12.5px;color:var(--navy);line-height:1.45;}


#weakQuestionCount:focus{outline:2px solid var(--green);outline-offset:1px;}


/* =========================================================================
   ASSIGNMENTS + MOBILE FIRST
=========================================================================== */
.assignment-system-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 16px;border:1px solid var(--border);border-radius:16px;background:#fff;margin-bottom:16px;}
.assignment-system-banner>div{display:flex;align-items:center;gap:10px;}
.system-dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(90,16,37,.08);}
.system-est{background:#5A1025}.system-act{background:#8E2945}.system-sat{background:#B7791F}.system-ap{background:#6C4FBB}
.assignment-list{display:grid;gap:13px;}
.assignment-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;display:grid;gap:14px;}
.assignment-info{min-width:0}.assignment-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--green-d);}
.assignment-info h3{font-size:18px;text-transform:none;color:var(--navy);margin-top:5px;}
.assignment-info p{font-size:12px;color:var(--muted-2);margin-top:5px;line-height:1.5;}
.assignment-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lesson-media-btn{border:1px solid var(--border);background:var(--bg-2);border-radius:13px;min-height:58px;
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:var(--navy);}
.lesson-media-btn.video{background:var(--green-l);border-color:rgba(142,41,69,.22);color:var(--green-d);}
.lesson-media-btn.pdf{background:#F8F1F3;border-color:rgba(90,16,37,.14);}
.lesson-media-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;}
.media-icon{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#fff;font-size:9px;}
.system-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.system-card{text-align:left;border:1px solid var(--border);background:#fff;border-radius:18px;padding:18px;cursor:pointer;}
.system-card-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted-2);}
.system-card h3{font-size:26px;color:var(--navy);margin-top:14px;}
.system-card p{font-size:12px;color:var(--muted-2);margin-top:4px;}
.teacher-system-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;}
.teacher-student-strip{display:flex;gap:8px;overflow:auto;padding:14px 0;border-bottom:1px solid var(--border);}
.student-chip{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg-2);font-size:11px;}
.avatar-mini{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:9px;font-weight:800;}
.teacher-upload-list{margin-top:8px;}
.teacher-assignment-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);}
.teacher-assignment-row:last-child{border-bottom:0;}
.teacher-file-status{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.file-ok,.file-empty{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;}
.file-ok{background:var(--green-l);color:var(--green-d)} .file-empty{background:#F4F1F2;color:var(--muted-2)}
.btn-small{padding:7px 10px;font-size:10px;}
@media(min-width:700px){
 .assignment-card{grid-template-columns:1fr auto;align-items:center;padding:20px;}
 .assignment-actions{min-width:220px;}
 .system-grid{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:699px){
 .container{width:calc(100% - 24px)!important;}
 body{font-size:14px;}
 .main-area{padding:16px!important;}
 .topline{gap:12px!important;}
 .topline h1{font-size:28px!important;}
 .grid-2,.grid-3{grid-template-columns:1fr!important;}
 .card{border-radius:16px!important;padding:16px!important;}
 .teacher-assignment-row{align-items:flex-start;flex-direction:column;}
 .teacher-file-status{justify-content:flex-start;}
 .btn{min-height:44px;}
}


.assignment-tabs{display:flex;gap:8px;overflow:auto;margin:0 0 18px;padding-bottom:2px;position:sticky;top:0;z-index:5;background:var(--bg);padding-top:3px;}
.assignment-tab{border:1px solid var(--border);background:#fff;color:var(--navy);font-weight:800;padding:10px 20px;border-radius:999px;cursor:pointer;min-width:78px;}
.assignment-tab:hover{transform:translateY(-2px);}
.assignment-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.assignment-anchor{scroll-margin-top:72px;margin-bottom:22px;}
.assignment-system-section{min-width:0;}
.assignment-course-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}
.assignment-course-head h2{font-size:22px;}
.assignment-lesson-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px;}
.assignment-lesson-main{min-width:0;flex:1;}
.assignment-lesson-main h3{font-size:16px;color:var(--navy);margin:0;}
.assignment-lesson-main p{font-size:12px;margin-top:4px;}
.assignment-lesson-action{min-width:100px;}
@media(max-width:699px){.assignment-lesson-card{align-items:flex-start;flex-direction:column;}.assignment-lesson-action{width:100%;}.assignment-lesson-action .btn{width:100%;}}

.course-upload-card{padding:20px;}
.course-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.course-upload-grid label,.upload-box{font-size:11px;font-weight:800;color:var(--navy);}
.form-input{width:100%;margin-top:7px;border:1px solid var(--border);border-radius:11px;padding:11px 12px;background:#fff;color:var(--navy);font:inherit;font-weight:500;box-sizing:border-box;}
.form-input:focus{outline:2px solid var(--green);outline-offset:1px;}
.upload-boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
.upload-box{border:1px dashed rgba(90,16,37,.25);border-radius:16px;padding:16px;background:var(--bg-2);display:grid;gap:9px;}
.upload-box p{font-size:11px;color:var(--muted-2);font-weight:500;margin-top:3px;}
.upload-box-icon{width:40px;height:40px;border-radius:12px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:900;}
.upload-name{font-size:10px;color:var(--muted-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.course-upload-save{margin-top:18px;width:100%;}
@media(max-width:699px){
 .course-upload-grid,.upload-boxes{grid-template-columns:1fr;}
 .course-upload-card{padding:16px;}
}


:root{--navy:#090612;--navy-2:#160a27;--navy-3:#7c20e8;--green:#a855f7;--green-l:#241238;--green-d:#c084fc;--blue:#b56cff;--blue-l:#241238;--bg:#07050c;--bg-2:#100b18;--card:#100b19;--ink:#f7f1ff;--muted:#c8bcd8;--muted-2:#9486a8;--border:rgba(168,85,247,.25);--shadow-sm:0 4px 22px rgba(112,35,210,.16);--shadow-md:0 12px 38px rgba(112,35,210,.24);--shadow-lg:0 24px 80px rgba(112,35,210,.32)}
html,body{background:#07050c!important;color:#f7f1ff!important}body{background:radial-gradient(circle at 10% 10%,rgba(139,43,226,.16),transparent 30%),radial-gradient(circle at 90% 25%,rgba(168,85,247,.13),transparent 28%),#07050c!important;overflow-x:hidden}body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(1px)}body:before{width:360px;height:360px;left:-120px;top:22%;background:radial-gradient(circle,rgba(168,85,247,.2),transparent 70%);animation:bg1 12s ease-in-out infinite}body:after{width:430px;height:430px;right:-160px;bottom:5%;background:radial-gradient(circle,rgba(111,22,217,.18),transparent 70%);animation:bg2 15s ease-in-out infinite}@keyframes bg1{50%{transform:translate(80px,-40px) scale(1.15)}}@keyframes bg2{50%{transform:translate(-70px,40px) scale(1.12)}}
h1,h2,h3,h4,.brand{color:#fff!important}.topbar{background:rgba(7,5,12,.78)!important;border-bottom:1px solid rgba(168,85,247,.25)!important;box-shadow:0 10px 35px rgba(0,0,0,.3)}.topnav a{color:#d8c9eb!important}.topnav a:hover{color:#c084fc!important}.btn-primary,.btn-green{background:linear-gradient(135deg,#7c20e8,#b34cff)!important;color:#fff!important;box-shadow:0 0 24px rgba(168,85,247,.28)}.btn-primary:hover,.btn-green:hover{box-shadow:0 0 34px rgba(168,85,247,.5)!important;transform:translateY(-4px) scale(1.02)!important}.btn-outline{color:#d9b8ff!important;border-color:#a855f7!important;background:rgba(168,85,247,.05)!important}.btn-ghost{background:rgba(255,255,255,.055)!important;color:#eee5fa!important}
.hero{min-height:700px;background:radial-gradient(circle at 65% 35%,rgba(139,43,226,.18),transparent 35%),linear-gradient(180deg,rgba(7,5,12,.2),rgba(7,5,12,.85))}.hero:before{background:radial-gradient(circle,rgba(168,85,247,.22),transparent 68%)!important;animation:glow 8s ease-in-out infinite}.hero:after{background:radial-gradient(circle,rgba(111,22,217,.18),transparent 68%)!important;animation:glow 10s ease-in-out infinite reverse}@keyframes glow{50%{transform:scale(1.18);opacity:1}}.eyebrow{background:rgba(168,85,247,.12)!important;color:#d8a9ff!important;border:1px solid rgba(168,85,247,.42)}.hero h1 em{color:#c084fc!important;text-shadow:0 0 25px rgba(192,132,252,.55)}.hero p.lead{color:#cbbddd!important}.hero-stat .num{color:#d8b4ff!important}.hero-stat .lbl{color:#9d90ad!important}
